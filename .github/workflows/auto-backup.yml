
name: Automatic Repository Backup

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create private backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e

          OWNER="ARJUNC0DER"
          REPO="${SOURCE_REPO#*/}"

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BACKUP_REPO="${REPO}-backup-${TIMESTAMP}"

          echo "========================================"
          echo "AUTOMATIC PRIVATE REPOSITORY BACKUP"
          echo "========================================"
          echo "Source repository : $SOURCE_REPO"
          echo "Backup owner      : $OWNER"
          echo "Backup repository : $BACKUP_REPO"
          echo "Commit            : $COMMIT_SHA"
          echo "========================================"

          # Verify the token belongs to ARJUNC0DER
          LOGIN=$(gh api user --jq '.login')
          echo "Authenticated account: $LOGIN"

          if [ "$LOGIN" != "$OWNER" ]; then
            echo "ERROR: BACKUP_TOKEN belongs to $LOGIN"
            echo "Expected: $OWNER"
            exit 1
          fi

          # Create a NEW PRIVATE repository
          gh repo create "$OWNER/$BACKUP_REPO" \
            --private \
            --description "Private automatic backup of $REPO at commit $COMMIT_SHA"

          echo "Private backup repository created."

          # Verify that GitHub can access the newly created repository
          echo "Verifying backup repository..."

          gh api "repos/${OWNER}/${BACKUP_REPO}" \
            --jq '"Repository confirmed: " + .full_name + " | Private: " + (.private | tostring)'

          # Create a temporary authentication header.
          # The token is never written into the repository.
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)

          # Add the newly created repository as a remote.
          git remote add backup \
            "https://github.com/${OWNER}/${BACKUP_REPO}.git"

          echo "Pushing all branches..."

          git -c "http.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            push backup --all

          echo "Pushing all tags..."

          git -c "http.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            push backup --tags

          echo "========================================"
          echo "BACKUP SUCCESSFUL"
          echo "========================================"
          echo "Backup repository:"
          echo "https://github.com/${OWNER}/${BACKUP_REPO}"
          echo "Visibility: PRIVATE"
          echo "========================================"
