name: Test Git Datadddbase API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Test Git Database API
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -e

          OWNER="ARJUNC0DER"
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          REPO="git-api-test-${TIMESTAMP}"

          echo "Creating repository..."

          gh repo create "$OWNER/$REPO" --private

          echo "Repository: $OWNER/$REPO"

          echo "Creating initial file through Contents API..."

          echo "Git Database API test" > test.txt

          CONTENT=$(base64 -w 0 test.txt)

          RESULT=$(gh api \
            --method PUT \
            "repos/${OWNER}/${REPO}/contents/test.txt" \
            -f message="Initial commit" \
            -f content="$CONTENT")

          COMMIT_SHA=$(echo "$RESULT" | jq -r '.commit.sha')

          echo "Initial commit created: $COMMIT_SHA"

          echo "Repository is no longer empty."

          echo "Testing Git Database API..."

          BLOB_SHA=$(gh api \
            --method POST \
            "repos/${OWNER}/${REPO}/git/blobs" \
            -f content="Git Database API test" \
            -f encoding="utf-8" \
            --jq '.sha')

          echo "Blob created: $BLOB_SHA"

          echo "SUCCESS: Git Database API is working."
