
name: Automatic Repository Backup

"on":
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create private backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e

          # Account where backups are created
          OWNER="ARJUNC0DER"

          # Original repository name
          REPO="${SOURCE_REPO#*/}"

          # Unique timestamp
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")

          # Unique backup repository name
          BACKUP_REPO="${REPO}-backup-${TIMESTAMP}"

          echo "========================================"
          echo "AUTOMATIC PRIVATE REPOSITORY BACKUP"
          echo "========================================"
          echo "Source repository : $SOURCE_REPO"
          echo "Backup owner      : $OWNER"
          echo "Backup repository : $BACKUP_REPO"
          echo "Commit            : $COMMIT_SHA"
          echo "========================================"

          # Verify token account
          LOGIN=$(gh api user --jq '.login')

          echo "Authenticated account: $LOGIN"

          if [ "$LOGIN" != "$OWNER" ]; then
            echo "ERROR: BACKUP_TOKEN belongs to $LOGIN."
            echo "Expected account: $OWNER"
            exit 1
          fi

          # Create a NEW PRIVATE repository
          gh repo create "$OWNER/$BACKUP_REPO" \
            --private \
            --description "Private automatic backup of $REPO at commit $COMMIT_SHA"

          echo "Private backup repository created."

          # Configure Git authentication using BACKUP_TOKEN
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

          # Add the newly created backup repository
          git remote add backup \
            "https://github.com/${OWNER}/${BACKUP_REPO}.git"

          echo "Pushing all branches..."

          # Push complete branch history
          git push backup --all

          echo "Pushing all tags..."

          # Push all tags
          git push backup --tags

          echo "========================================"
          echo "BACKUP SUCCESSFUL"
          echo "========================================"
          echo "Repository:"
          echo "https://github.com/${OWNER}/${BACKUP_REPO}"
          echo "Visibility: PRIVATE"
          echo "========================================"
