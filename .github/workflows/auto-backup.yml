name: Full Private Git History Backup

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  backup:
    # IMPORTANT:
    # Never run this workflow from a backup repository.
    if: github.repository == 'HARSHITC0DER/java'

    runs-on: ubuntu-latest

    env:
      SOURCE_OWNER: HARSHITC0DER
      SOURCE_REPO: java
      BACKUP_OWNER: ARJUNC0DER
      BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}

      # GitHub has secondary limits on write-heavy REST API usage.
      # Keep this deliberately conservative.
      WRITE_DELAY: "1.50"

      # Number of API retries for temporary/secondary-limit failures.
      MAX_RETRIES: "8"

    steps:

      # ============================================================
      # 1. CHECKOUT COMPLETE SOURCE HISTORY
      # ============================================================

      - name: Checkout complete Git history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # ============================================================
      # 2. FETCH EVERY BRANCH AND TAG
      # ============================================================

      - name: Fetch all branches and tags
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            --force

          echo "Branches:"
          git for-each-ref \
            --format='%(refname:short)' \
            refs/remotes/origin

          echo
          echo "Tags:"
          git for-each-ref \
            --format='%(refname:short)' \
            refs/tags

      # ============================================================
      # 3. CREATE NEW PRIVATE BACKUP REPOSITORY
      # ============================================================

      - name: Create private backup repository
        id: create_backup
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail

          TIMESTAMP="$(date -u '+%Y%m%d-%H%M%S')"

          BACKUP_REPO="java-backup-${TIMESTAMP}"

          echo "Backup repository: ${BACKUP_REPO}"

          gh repo create \
            "${BACKUP_OWNER}/${BACKUP_REPO}" \
            --private \
            --description "Full private Git history backup of ${SOURCE_OWNER}/${SOURCE_REPO}" \
            --confirm

          echo "BACKUP_REPO=${BACKUP_REPO}" >> "$GITHUB_ENV"

          echo
          echo "Created:"
          echo "https://github.com/${BACKUP_OWNER}/${BACKUP_REPO}"

      # ============================================================
      # 4. INITIALIZE EMPTY REPOSITORY
      #
      # GitHub does not allow Git Database refs to be created in
      # an absolutely empty repository. We therefore create one
      # temporary initialization file first.
      # ============================================================

      - name: Initialize backup repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail

          echo "Initializing backup repository..."

          printf 'Temporary initialization for Git Database migration.\n' \
            > /tmp/backup-initialization.txt

          gh api \
            --method PUT \
            "repos/${BACKUP_OWNER}/${BACKUP_REPO}/contents/.backup-initialization" \
            -f message="Initialize backup repository" \
            -f content="$(base64 -w 0 /tmp/backup-initialization.txt)"

          echo "Backup repository initialized."

      # ============================================================
      # 5. MIGRATE COMPLETE GIT DATABASE
      # ============================================================

      - name: Migrate complete Git history
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "STARTING GIT DATABASE MIGRATION"
          echo "========================================"

          python3 <<'PYTHON'
          import os
          import sys
          import time
          import json
          import base64
          import subprocess
          from datetime import datetime, timezone, timedelta

          OWNER = os.environ["BACKUP_OWNER"]
          REPO = os.environ["BACKUP_REPO"]
          TOKEN = os.environ["BACKUP_TOKEN"]

          WRITE_DELAY = float(os.environ.get("WRITE_DELAY", "1.50"))
          MAX_RETRIES = int(os.environ.get("MAX_RETRIES", "8"))

          API_VERSION = "2026-03-10"

          API_BASE = f"https://api.github.com/repos/{OWNER}/{REPO}"

          HEADERS = [
              "-H", "Accept: application/vnd.github+json",
              "-H", f"Authorization: Bearer {TOKEN}",
              "-H", f"X-GitHub-Api-Version: {API_VERSION}",
          ]


          # ========================================================
          # SHELL HELPERS
          # ========================================================

          def git(*args, raw=False):
              result = subprocess.run(
                  ["git", *args],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=True
              )

              if raw:
                  return result.stdout

              return result.stdout.decode("utf-8", errors="replace")


          def git_text(*args):
              return git(*args, raw=False)


          def sleep_write():
              time.sleep(WRITE_DELAY)


          # ========================================================
          # GITHUB API HELPER
          # ========================================================

          def github_api(method, endpoint, payload=None, write=True):
              """
              Reliable GitHub API call with:
              - retry handling
              - secondary rate-limit handling
              - 403/429 handling
              - 422 retry handling
              - Retry-After support
              """

              url = f"https://api.github.com{endpoint}"

              for attempt in range(1, MAX_RETRIES + 1):

                  command = [
                      "curl",
                      "-sS",
                      "-L",
                      "-X",
                      method,
                      *HEADERS,
                      "-w",
                      "\n__HTTP_STATUS__:%{http_code}\n",
                  ]

                  if payload is not None:
                      command += [
                          "-H",
                          "Content-Type: application/json",
                          "--data",
                          json.dumps(payload, separators=(",", ":")),
                      ]

                  command.append(url)

                  result = subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True
                  )

                  if result.returncode != 0:
                      if attempt == MAX_RETRIES:
                          raise RuntimeError(
                              f"curl failed after {MAX_RETRIES} attempts:\n"
                              f"{result.stderr}"
                          )

                      wait = min(60, 2 ** (attempt - 1))

                      print(
                          f"curl failure. Retry {attempt}/{MAX_RETRIES} "
                          f"after {wait}s..."
                      )

                      time.sleep(wait)
                      continue

                  output = result.stdout

                  marker = "\n__HTTP_STATUS__:"
                  if marker not in output:
                      if attempt == MAX_RETRIES:
                          raise RuntimeError(
                              "GitHub API returned an unexpected response:\n"
                              + output
                          )

                      time.sleep(min(60, 2 ** (attempt - 1)))
                      continue

                  body, status_part = output.rsplit(marker, 1)

                  status = int(status_part.strip())

                  try:
                      data = json.loads(body) if body.strip() else {}
                  except json.JSONDecodeError:
                      data = {
                          "raw": body
                      }

                  # ------------------------------------------------
                  # SUCCESS
                  # ------------------------------------------------

                  if 200 <= status < 300:
                      if write:
                          sleep_write()

                      return data

                  # ------------------------------------------------
                  # RATE LIMIT / SECONDARY RATE LIMIT
                  # ------------------------------------------------

                  message = ""

                  if isinstance(data, dict):
                      message = str(data.get("message", ""))

                  retry_after = None

                  # Get Retry-After header separately only when
                  # necessary. GitHub may provide it on rate-limit
                  # responses.
                  if status in (403, 429):
                      header_command = [
                          "curl",
                          "-sS",
                          "-I",
                          *HEADERS,
                          url
                      ]

                      header_result = subprocess.run(
                          header_command,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          text=True
                      )

                      for line in header_result.stdout.splitlines():
                          if line.lower().startswith("retry-after:"):
                              try:
                                  retry_after = int(
                                      line.split(":", 1)[1].strip()
                                  )
                              except Exception:
                                  pass

                  # ------------------------------------------------
                  # TEMPORARY 422 / 403 / 429
                  # ------------------------------------------------

                  if status in (403, 409, 422, 429):

                      if attempt == MAX_RETRIES:
                          raise RuntimeError(
                              f"GitHub API failed after "
                              f"{MAX_RETRIES} attempts.\n"
                              f"HTTP {status}\n"
                              f"Message: {message}\n"
                              f"Response: {json.dumps(data, indent=2)}"
                          )

                      if retry_after is not None:
                          wait = max(retry_after, 5)
                      else:
                          # Increasing delay for GitHub's secondary
                          # rate-limit / anti-spam protection.
                          wait = min(
                              120,
                              max(
                                  5,
                                  5 * (2 ** (attempt - 1))
                              )
                          )

                      print(
                          f"GitHub API HTTP {status}. "
                          f"Message: {message}"
                      )

                      print(
                          f"Retry {attempt}/{MAX_RETRIES} "
                          f"after {wait}s..."
                      )

                      time.sleep(wait)
                      continue

                  # ------------------------------------------------
                  # PERMANENT ERROR
                  # ------------------------------------------------

                  raise RuntimeError(
                      f"GitHub API error.\n"
                      f"HTTP {status}\n"
                      f"Endpoint: {endpoint}\n"
                      f"Message: {message}\n"
                      f"Response:\n"
                      f"{json.dumps(data, indent=2)}"
                  )

              raise RuntimeError("Unexpected API retry termination.")


          # ========================================================
          # ANALYZE SOURCE
          # ========================================================

          print("========================================")
          print("ANALYZING SOURCE REPOSITORY")
          print("========================================")

          commits = git_text(
              "rev-list",
              "--all",
              "--topo-order",
              "--reverse"
          ).splitlines()

          commits = [x.strip() for x in commits if x.strip()]

          object_lines = git_text(
              "rev-list",
              "--objects",
              "--all"
          ).splitlines()

          print(f"Commits : {len(commits)}")
          print(f"Objects : {len(object_lines)}")


          # ========================================================
          # GIT LFS DETECTION
          # ========================================================

          print("Checking Git LFS...")

          lfs_files = []

          try:
              lfs_output = git_text(
                  "ls-files",
                  "-z",
                  "--"
              )

              # Git LFS tracking information is checked separately.
              attrs = git_text(
                  "check-attr",
                  "-a",
                  "--",
                  *(
                      git_text(
                          "ls-files"
                      ).splitlines()
                  )
              )

              if "filter: lfs" in attrs:
                  print(
                      "WARNING: Git LFS files detected."
                  )
                  print(
                      "This workflow preserves LFS pointer blobs, "
                      "but does not upload LFS binary objects."
                  )

          except Exception:
              pass


          # ========================================================
          # ENUMERATE BLOBS
          # ========================================================

          print("========================================")
          print("UPLOADING BLOBS")
          print("========================================")

          blobs = []

          for line in object_lines:

              if not line:
                  continue

              parts = line.split(" ", 1)

              sha = parts[0]

              try:
                  obj_type = git_text(
                      "cat-file",
                      "-t",
                      sha
                  ).strip()
              except Exception:
                  continue

              if obj_type == "blob":
                  blobs.append(sha)

          # Remove duplicates while preserving order.
          blobs = list(dict.fromkeys(blobs))

          print(f"Blobs found: {len(blobs)}")


          # ========================================================
          # UPLOAD BLOBS
          # ========================================================

          for index, sha in enumerate(blobs, 1):

              raw = git(
                  "cat-file",
                  "blob",
                  sha,
                  raw=True
              )

              encoded = base64.b64encode(raw).decode("ascii")

              print(
                  f"[{index}/{len(blobs)}] "
                  f"Blob {sha} ({len(raw)} bytes)"
              )

              response = github_api(
                  "POST",
                  f"/repos/{OWNER}/{REPO}/git/blobs",
                  {
                      "content": encoded,
                      "encoding": "base64"
                  }
              )

              remote_sha = response.get("sha")

              if remote_sha != sha:
                  raise RuntimeError(
                      f"Blob SHA mismatch.\n"
                      f"Source : {sha}\n"
                      f"Remote : {remote_sha}"
                  )

          print("All blobs uploaded successfully.")


          # ========================================================
          # PARSE GIT DATE
          # ========================================================

          def git_date_to_iso(timestamp, tz_seconds):

              timestamp = int(timestamp)
              tz_seconds = int(tz_seconds)

              dt = datetime.fromtimestamp(
                  timestamp,
                  timezone.utc
              )

              sign = "+" if tz_seconds >= 0 else "-"

              absolute = abs(tz_seconds)

              hours = absolute // 3600
              minutes = (absolute % 3600) // 60

              tz = f"{sign}{hours:02d}:{minutes:02d}"

              return dt.strftime(
                  "%Y-%m-%dT%H:%M:%S"
              ) + tz


          # ========================================================
          # PARSE COMMIT
          # ========================================================

          def parse_commit(sha):

              raw = git(
                  "cat-file",
                  "commit",
                  sha,
                  raw=True
              ).decode(
                  "utf-8",
                  errors="replace"
              )

              header, message = raw.split(
                  "\n\n",
                  1
              )

              parents = []

              author_name = None
              author_email = None
              author_timestamp = None
              author_timezone = None

              committer_name = None
              committer_email = None
              committer_timestamp = None
              committer_timezone = None

              signature_lines = []

              lines = header.splitlines()

              i = 0

              while i < len(lines):

                  line = lines[i]

                  if line.startswith("tree "):

                      i += 1
                      continue

                  if line.startswith("parent "):

                      parents.append(
                          line[7:].strip()
                      )

                      i += 1
                      continue

                  if line.startswith("author "):

                      value = line[7:]

                      parts = value.rsplit(" ", 2)

                      identity = parts[0]

                      timestamp = parts[1]
                      timezone_value = parts[2]

                      name, email = identity.rsplit(
                          " <",
                          1
                      )

                      email = email.rstrip(">")

                      author_name = name
                      author_email = email
                      author_timestamp = timestamp
                      author_timezone = timezone_value

                      i += 1
                      continue

                  if line.startswith("committer "):

                      value = line[10:]

                      parts = value.rsplit(" ", 2)

                      identity = parts[0]

                      timestamp = parts[1]
                      timezone_value = parts[2]

                      name, email = identity.rsplit(
                          " <",
                          1
                      )

                      email = email.rstrip(">")

                      committer_name = name
                      committer_email = email
                      committer_timestamp = timestamp
                      committer_timezone = timezone_value

                      i += 1
                      continue

                  # ------------------------------------------------
                  # Git signed commit.
                  #
                  # First line:
                  #   gpgsig -----BEGIN PGP SIGNATURE-----
                  #
                  # Following lines begin with one space.
                  # ------------------------------------------------

                  if line.startswith("gpgsig "):

                      first = line[len("gpgsig "):]

                      signature_lines.append(first)

                      i += 1

                      while i < len(lines):

                          continuation = lines[i]

                          if not continuation.startswith(" "):
                              break

                          signature_lines.append(
                              continuation[1:]
                          )

                          i += 1

                      continue

                  i += 1

              signature = None

              if signature_lines:

                  signature = "\n".join(
                      signature_lines
                  )

                  # GitHub's REST Create Commit API supports
                  # ASCII-armored PGP signatures.
                  if "-----BEGIN PGP SIGNATURE-----" not in signature:
                      raise RuntimeError(
                          f"Commit {sha} contains a non-PGP "
                          f"gpgsig header. Exact REST reconstruction "
                          f"is not supported for this signature type."
                      )

              return {
                  "tree": git_text(
                      "rev-parse",
                      f"{sha}^{{tree}}"
                  ).strip(),

                  "parents": parents,

                  "message": message,

                  "author": {
                      "name": author_name,
                      "email": author_email,
                      "date": git_date_to_iso(
                          author_timestamp,
                          int(
                              (
                                  author_timezone[0]
                                  == "-"
                              )
                              * -1
                              * int(
                                  author_timezone[1:3]
                              )
                              * 3600
                              +
                              (
                                  -1
                                  if author_timezone[0] == "-"
                                  else 1
                              )
                              * int(
                                  author_timezone[1:3]
                              )
                              * 3600
                          )
                          if False
                          else
                          (
                              (
                                  -1
                                  if author_timezone[0] == "-"
                                  else 1
                              )
                              *
                              (
                                  int(author_timezone[1:3]) * 3600
                                  +
                                  int(author_timezone[3:5]) * 60
                              )
                          )
                      )
                  },

                  "committer": {
                      "name": committer_name,
                      "email": committer_email,
                      "date": git_date_to_iso(
                          committer_timestamp,
                          (
                              (
                                  -1
                                  if committer_timezone[0] == "-"
                                  else 1
                              )
                              *
                              (
                                  int(committer_timezone[1:3]) * 3600
                                  +
                                  int(committer_timezone[3:5]) * 60
                              )
                          )
                      )
                  },

                  "signature": signature
              }


          # ========================================================
          # CREATE TREES
          # ========================================================

          print("========================================")
          print("RECREATING TREES")
          print("========================================")

          tree_map = {}


          for index, commit_sha in enumerate(commits, 1):

              tree_sha = git_text(
                  "rev-parse",
                  f"{commit_sha}^{{tree}}"
              ).strip()

              if tree_sha in tree_map:
                  continue

              print(
                  f"[TREE {len(tree_map)+1}] "
                  f"{tree_sha}"
              )

              entries = []

              raw_tree = git(
                  "ls-tree",
                  "-r",
                  "-z",
                  "--full-tree",
                  tree_sha,
                  raw=True
              )

              records = raw_tree.split(b"\x00")

              for record in records:

                  if not record:
                      continue

                  tab_index = record.find(b"\t")

                  if tab_index == -1:
                      continue

                  left = record[:tab_index]
                  path_bytes = record[tab_index + 1:]

                  path = path_bytes.decode(
                      "utf-8",
                      errors="surrogateescape"
                  )

                  left_parts = left.split(
                      b" ",
                      2
                  )

                  mode = left_parts[0].decode()

                  obj_type = left_parts[1].decode()

                  obj_sha = left_parts[2].decode()

                  if obj_type == "blob":

                      entries.append({
                          "path": path,
                          "mode": mode,
                          "type": "blob",
                          "sha": obj_sha
                      })

                  elif obj_type == "commit":

                      entries.append({
                          "path": path,
                          "mode": mode,
                          "type": "commit",
                          "sha": obj_sha
                      })

                  elif obj_type == "tree":

                      entries.append({
                          "path": path,
                          "mode": mode,
                          "type": "tree",
                          "sha": obj_sha
                      })

              response = github_api(
                  "POST",
                  f"/repos/{OWNER}/{REPO}/git/trees",
                  {
                      "tree": entries
                  }
              )

              remote_tree_sha = response.get("sha")

              if remote_tree_sha != tree_sha:

                  raise RuntimeError(
                      "\nTREE SHA MISMATCH\n"
                      f"Source tree : {tree_sha}\n"
                      f"Remote tree : {remote_tree_sha}\n"
                      f"Commit      : {commit_sha}\n"
                      f"Entries     : {len(entries)}"
                  )

              tree_map[tree_sha] = remote_tree_sha

          print(
              f"All trees recreated: {len(tree_map)}"
          )


          # ========================================================
          # CREATE COMMITS
          # ========================================================

          print("========================================")
          print("RECREATING COMMITS")
          print("========================================")

          commit_map = {}

          for index, source_sha in enumerate(commits, 1):

              print(
                  f"[{index}/{len(commits)}] "
                  f"Commit {source_sha}"
              )

              parsed = parse_commit(
                  source_sha
              )

              tree_sha = parsed["tree"]

              if tree_sha not in tree_map:

                  raise RuntimeError(
                      f"Tree {tree_sha} was not recreated "
                      f"for commit {source_sha}"
                  )

              payload = {
                  "message": parsed["message"],
                  "tree": tree_map[tree_sha],
                  "parents": [
                      commit_map.get(parent, parent)
                      for parent in parsed["parents"]
                  ],
                  "author": parsed["author"],
                  "committer": parsed["committer"]
              }

              if parsed["signature"] is not None:
                  payload["signature"] = parsed["signature"]

              response = github_api(
                  "POST",
                  f"/repos/{OWNER}/{REPO}/git/commits",
                  payload
              )

              remote_sha = response.get("sha")

              if remote_sha != source_sha:

                  raise RuntimeError(
                      "\n========================================\n"
                      "COMMIT SHA MISMATCH\n"
                      "========================================\n"
                      f"Source commit : {source_sha}\n"
                      f"Remote commit : {remote_sha}\n"
                      f"Tree          : {tree_sha}\n"
                      f"Remote tree   : {tree_map[tree_sha]}\n"
                      f"Parents       : {parsed['parents']}\n"
                      f"Signed        : {parsed['signature'] is not None}\n"
                      "========================================"
                  )

              commit_map[source_sha] = remote_sha

          print(
              f"All commits recreated: {len(commit_map)}"
          )


          # ========================================================
          # RESTORE BRANCHES
          # ========================================================

          print("========================================")
          print("RESTORING BRANCHES")
          print("========================================")

          branch_lines = git_text(
              "for-each-ref",
              "--format=%(refname:strip=3)",
              "refs/remotes/origin"
          ).splitlines()

          branches = []

          for branch in branch_lines:

              branch = branch.strip()

              if not branch:
                  continue

              if branch == "HEAD":
                  continue

              branches.append(branch)

          branches = list(
              dict.fromkeys(branches)
          )

          print(
              f"Branches found: {len(branches)}"
          )

          for branch in branches:

              local_ref = f"refs/remotes/origin/{branch}"

              source_sha = git_text(
                  "rev-parse",
                  local_ref
              ).strip()

              remote_sha = commit_map.get(
                  source_sha
              )

              if remote_sha is None:

                  raise RuntimeError(
                      f"Branch {branch} points to "
                      f"unknown commit {source_sha}"
                  )

              print(
                  f"Branch: {branch} -> {source_sha}"
              )

              github_api(
                  "POST",
                  f"/repos/{OWNER}/{REPO}/git/refs",
                  {
                      "ref": f"refs/heads/{branch}",
                      "sha": remote_sha
                  }
              )


          # ========================================================
          # RESTORE TAGS
          # ========================================================

          print("========================================")
          print("RESTORING TAGS")
          print("========================================")

          tag_lines = git_text(
              "for-each-ref",
              "--format=%(refname)%00%(objectname)%00%(objecttype)",
              "refs/tags"
          ).splitlines()

          for line in tag_lines:

              if not line:
                  continue

              parts = line.split("\x00")

              if len(parts) != 3:
                  continue

              full_ref = parts[0]
              object_sha = parts[1]
              object_type = parts[2]

              tag_name = full_ref[
                  len("refs/tags/"):]
              ]

              print(
                  f"Tag: {tag_name}"
              )

              # ----------------------------------------------------
              # LIGHTWEIGHT TAG
              # ----------------------------------------------------

              if object_type != "tag":

                  target = object_sha

                  if target in commit_map:
                      target = commit_map[target]

                  github_api(
                      "POST",
                      f"/repos/{OWNER}/{REPO}/git/refs",
                      {
                          "ref": f"refs/tags/{tag_name}",
                          "sha": target
                      }
                  )

                  continue

              # ----------------------------------------------------
              # ANNOTATED TAG
              # ----------------------------------------------------

              raw_tag = git(
                  "cat-file",
                  "tag",
                  object_sha,
                  raw=True
              ).decode(
                  "utf-8",
                  errors="replace"
              )

              tag_header, tag_message = raw_tag.split(
                  "\n\n",
                  1
              )

              target_sha = None
              tagger_name = None
              tagger_email = None
              tagger_timestamp = None
              tagger_timezone = None

              tag_signature = False

              for header_line in tag_header.splitlines():

                  if header_line.startswith("object "):

                      target_sha = header_line[7:].strip()

                  elif header_line.startswith("tagger "):

                      value = header_line[7:]

                      pieces = value.rsplit(" ", 2)

                      identity = pieces[0]

                      tagger_timestamp = pieces[1]
                      tagger_timezone = pieces[2]

                      tagger_name, tagger_email = identity.rsplit(
                          " <",
                          1
                      )

                      tagger_email = tagger_email.rstrip(">")

              if "-----BEGIN PGP SIGNATURE-----" in tag_message:

                  tag_signature = True

              if tag_signature:

                  raise RuntimeError(
                      "\n========================================\n"
                      "SIGNED ANNOTATED TAG DETECTED\n"
                      "========================================\n"
                      f"Tag: {tag_name}\n"
                      f"Object: {object_sha}\n"
                      "\n"
                      "GitHub's Create Tag Object REST API does not "
                      "provide a signature parameter for creating "
                      "signed annotated tag objects.\n"
                      "\n"
                      "The workflow stopped intentionally instead of "
                      "silently changing the signed tag.\n"
                      "========================================"
                  )

              if target_sha in commit_map:

                  target_sha = commit_map[target_sha]

              tagger_offset = (
                  (
                      -1
                      if tagger_timezone[0] == "-"
                      else 1
                  )
                  *
                  (
                      int(tagger_timezone[1:3]) * 3600
                      +
                      int(tagger_timezone[3:5]) * 60
                  )
              )

              tagger_date = git_date_to_iso(
                  tagger_timestamp,
                  tagger_offset
              )

              response = github_api(
                  "POST",
                  f"/repos/{OWNER}/{REPO}/git/tags",
                  {
                      "tag": tag_name,
                      "message": tag_message,
                      "object": target_sha,
                      "type": "commit",
                      "tagger": {
                          "name": tagger_name,
                          "email": tagger_email,
                          "date": tagger_date
                      }
                  }
              )

              tag_object_sha = response.get(
                  "sha"
              )

              github_api(
                  "POST",
                  f"/repos/{OWNER}/{REPO}/git/refs",
                  {
                      "ref": f"refs/tags/{tag_name}",
                      "sha": tag_object_sha
                  }
              )


          # ========================================================
          # REMOVE TEMPORARY INITIALIZATION FILE
          #
          # We intentionally leave the temporary initialization
          # commit unreachable. Removing it through Contents API
          # would generate another commit and is unnecessary.
          # It is not reachable from any restored branch/tag.
          # ========================================================

          print("========================================")
          print("VERIFYING BACKUP")
          print("========================================")


          # ========================================================
          # VERIFY MAIN
          # ========================================================

          source_main = git_text(
              "rev-parse",
              "refs/remotes/origin/main"
          ).strip()

          remote_main_response = github_api(
              "GET",
              f"/repos/{OWNER}/{REPO}/git/ref/heads/main",
              write=False
          )

          remote_main = remote_main_response[
              "object"
          ][
              "sha"
          ]

          print(
              f"Source main : {source_main}"
          )

          print(
              f"Backup main : {remote_main}"
          )

          if remote_main != source_main:

              raise RuntimeError(
                  "MAIN BRANCH SHA VERIFICATION FAILED"
              )


          # ========================================================
          # VERIFY BRANCH SET
          # ========================================================

          remote_branches = []

          page = 1

          while True:

              response = github_api(
                  "GET",
                  f"/repos/{OWNER}/{REPO}/branches"
                  f"?per_page=100&page={page}",
                  write=False
              )

              if not response:
                  break

              for item in response:
                  remote_branches.append(
                      item["name"]
                  )

              if len(response) < 100:
                  break

              page += 1

          source_branches = set(
              branches
          )

          destination_branches = set(
              remote_branches
          )

          if source_branches != destination_branches:

              missing = sorted(
                  source_branches -
                  destination_branches
              )

              extra = sorted(
                  destination_branches -
                  source_branches
              )

              raise RuntimeError(
                  "\nBRANCH VERIFICATION FAILED\n"
                  f"Missing branches: {missing}\n"
                  f"Extra branches: {extra}"
              )


          # ========================================================
          # FINAL RESULT
          # ========================================================

          print()
          print("========================================")
          print("BACKUP COMPLETED SUCCESSFULLY")
          print("========================================")

          print(
              f"Source repository : "
              f"{os.environ.get('SOURCE_OWNER', 'HARSHITC0DER')}/"
              f"{os.environ.get('SOURCE_REPO', 'java')}"
          )

          print(
              f"Backup repository : "
              f"{OWNER}/{REPO}"
          )

          print(
              f"Commits backed up : {len(commit_map)}"
          )

          print(
              f"Trees backed up   : {len(tree_map)}"
          )

          print(
              f"Blobs backed up   : {len(blobs)}"
          )

          print(
              f"Branches restored : {len(branches)}"
          )

          print()
          print(
              f"https://github.com/{OWNER}/{REPO}"
          )

          print(
              "========================================"
          )

          PYTHON

