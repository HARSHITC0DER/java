name: Automatic Private Repository Backup

"on":
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create private backup and copy current files
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e

          OWNER="ARJUNC0DER"
          REPO="${SOURCE_REPO#*/}"

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BACKUP_REPO="${REPO}-backup-${TIMESTAMP}"

          echo "========================================"
          echo "AUTOMATIC PRIVATE REPOSITORY BACKUP"
          echo "========================================"
          echo "Source repository : $SOURCE_REPO"
          echo "Backup owner      : $OWNER"
          echo "Backup repository : $BACKUP_REPO"
          echo "Commit            : $COMMIT_SHA"
          echo "========================================"

          # Verify the token belongs to ARJUNC0DER
          LOGIN=$(gh api user --jq '.login')

          echo "Authenticated account: $LOGIN"

          if [ "$LOGIN" != "$OWNER" ]; then
            echo "ERROR: BACKUP_TOKEN belongs to $LOGIN"
            echo "Expected account: $OWNER"
            exit 1
          fi

          # Create a NEW PRIVATE repository
          gh repo create "$OWNER/$BACKUP_REPO" \
            --private \
            --description "Automatic private backup of $REPO at commit $COMMIT_SHA"

          echo "Private backup repository created."

          # Verify repository
          gh api "repos/${OWNER}/${BACKUP_REPO}" \
            --jq '"Repository confirmed: " + .full_name + " | Private: " + (.private | tostring)'

          # Configure GitHub API authentication
          export GH_TOKEN="$GH_TOKEN"

          # Create a temporary directory containing the source files.
          # Exclude the .git directory because the backup is created as a
          # fresh repository.
          TEMP_DIR="$(mktemp -d)"

          rsync -a \
            --exclude='.git/' \
            ./ "$TEMP_DIR/"

          cd "$TEMP_DIR"

          # Initialize a fresh Git repository for the backup.
          git init
          git checkout -b main

          git config user.name "ARJUNC0DER Backup"
          git config user.email "ARJUNC0DER@users.noreply.github.com"

          git add -A

          git commit \
            -m "Automatic backup of ${REPO} at ${COMMIT_SHA}"

          # Configure authenticated Git remote using the same token.
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${BACKUP_REPO}.git"

          echo "Pushing backup..."

          git push -u origin main

          echo "========================================"
          echo "BACKUP SUCCESSFUL"
          echo "========================================"
          echo "Backup repository:"
          echo "https://github.com/${OWNER}/${BACKUP_REPO}"
          echo "Visibility: PRIVATE"
          echo "========================================"
