```yaml
name: Automatic Repository Backup

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          OWNER="ARJUNC0DER"
          REPO="${SOURCE_REPO#*/}"
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BACKUP_REPO="${REPO}-backup-${TIMESTAMP}"

          echo "Source repository: $SOURCE_REPO"
          echo "Backup owner: $OWNER"
          echo "Backup repository: $BACKUP_REPO"
          echo "Commit: $COMMIT_SHA"

          gh repo create "$OWNER/$BACKUP_REPO" \
            --private \
            --description "Automatic backup of $REPO at commit $COMMIT_SHA"

          git remote add backup \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${BACKUP_REPO}.git"

          git push backup --all
          git push backup --tags

          echo "Backup created successfully:"
          echo "https://github.com/${OWNER}/${BACKUP_REPO}"
```
