name: Full Private Git History Backup

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  backup:
    # IMPORTANT:
    # Only HARSHITC0DER/java is allowed to execute this job.
    # Backup repositories cannot recursively create backups.
    if: github.repository == 'HARSHITC0DER/java'

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT COMPLETE SOURCE REPOSITORY
      # ============================================================

      - name: Checkout complete Git history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # ============================================================
      # 2. FETCH ALL BRANCHES AND TAGS
      # ============================================================

      - name: Fetch all branches and tags
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            --force

          echo "========================================"
          echo "SOURCE REPOSITORY"
          echo "========================================"

          echo "Branches:"
          git for-each-ref \
            --format='%(refname:strip=3)' \
            refs/remotes/origin

          echo
          echo "Tags:"
          git tag --list

          echo
          echo "Commit count:"
          git rev-list --all --count

          echo
          echo "========================================"

      # ============================================================
      # 3. CREATE PRIVATE BACKUP REPOSITORY
      # ============================================================

      - name: Create private backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER="ARJUNC0DER"
          SOURCE_NAME="${SOURCE_REPO#*/}"

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")

          BACKUP_REPO="${SOURCE_NAME}-backup-${TIMESTAMP}"

          echo "========================================"
          echo "FULL PRIVATE GIT BACKUP"
          echo "========================================"
          echo "Source repository : ${SOURCE_REPO}"
          echo "Backup owner      : ${OWNER}"
          echo "Backup repository : ${BACKUP_REPO}"
          echo "Source commit     : ${SOURCE_COMMIT}"
          echo "========================================"

          echo
          echo "Checking authentication..."

          LOGIN=$(gh api user --jq '.login')

          echo "Authenticated account: ${LOGIN}"

          if [ "${LOGIN}" != "${OWNER}" ]; then
            echo
            echo "ERROR: Wrong PAT account."
            echo "Authenticated: ${LOGIN}"
            echo "Expected: ${OWNER}"
            exit 1
          fi

          echo
          echo "Creating private backup repository..."

          gh repo create "${OWNER}/${BACKUP_REPO}" \
            --private \
            --description \
            "Complete Git history backup of ${SOURCE_REPO} at ${SOURCE_COMMIT}"

          echo
          echo "Repository created:"
          echo "https://github.com/${OWNER}/${BACKUP_REPO}"

          echo
          echo "Confirming repository..."

          gh api \
            "repos/${OWNER}/${BACKUP_REPO}" \
            --jq '"Repository confirmed: " + .full_name + " | Private: " + (.private | tostring)'

          echo "BACKUP_OWNER=${OWNER}" >> "$GITHUB_ENV"
          echo "BACKUP_REPO=${BACKUP_REPO}" >> "$GITHUB_ENV"

      # ============================================================
      # 4. INITIALIZE EMPTY REPOSITORY
      # ============================================================

      - name: Initialize backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INITIALIZING BACKUP REPOSITORY"
          echo "========================================"

          echo "Repository:"
          echo "${BACKUP_OWNER}/${BACKUP_REPO}"

          INIT_CONTENT=$(
            printf '%s' "Temporary backup initialization" |
            base64 -w 0
          )

          gh api \
            --method PUT \
            "repos/${BACKUP_OWNER}/${BACKUP_REPO}/contents/.backup-initialization" \
            -f message="Initialize backup repository" \
            -f content="${INIT_CONTENT}" \
            > /tmp/backup-init.json

          INIT_SHA=$(jq -r '.commit.sha' /tmp/backup-init.json)

          echo
          echo "Temporary initialization commit:"
          echo "${INIT_SHA}"

          echo
          echo "Repository initialized."

      # ============================================================
      # 5. MIGRATE COMPLETE GIT HISTORY
      # ============================================================

      - name: Migrate complete Git history
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          export BACKUP_OWNER
          export BACKUP_REPO

          echo "========================================"
          echo "STARTING GIT DATABASE MIGRATION"
          echo "========================================"

          python3 <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path


          OWNER = os.environ["BACKUP_OWNER"]
          REPO = os.environ["BACKUP_REPO"]

          WORK_DIR = Path("/tmp/git-backup")
          WORK_DIR.mkdir(parents=True, exist_ok=True)

          WRITE_DELAY = 0.30


          # ========================================================
          # COMMAND HELPERS
          # ========================================================

          def run_command(command):

              result = subprocess.run(
                  command,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False
              )

              if result.returncode != 0:

                  print()
                  print("COMMAND FAILED:")
                  print(" ".join(command))
                  print()

                  print(
                      result.stderr.decode(
                          "utf-8",
                          errors="replace"
                      )
                  )

                  raise RuntimeError(
                      "Command failed"
                  )

              return result.stdout


          def git(*args):

              return run_command(
                  ["git", *args]
              ).decode(
                  "utf-8",
                  errors="replace"
              )


          def git_bytes(*args):

              return run_command(
                  ["git", *args]
              )


          # ========================================================
          # GITHUB API
          # ========================================================

          def github_api(
              method,
              endpoint,
              payload=None
          ):

              command = [
                  "gh",
                  "api",
                  "--method",
                  method,
                  endpoint
              ]

              if payload is not None:

                  request_file = (
                      WORK_DIR / "request.json"
                  )

                  with request_file.open(
                      "w",
                      encoding="utf-8"
                  ) as f:

                      json.dump(
                          payload,
                          f,
                          ensure_ascii=False,
                          separators=(",", ":")
                      )

                  command.extend(
                      [
                          "--input",
                          str(request_file)
                      ]
                  )

              last_error = ""

              for attempt in range(1, 7):

                  result = subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=False
                  )

                  if result.returncode == 0:

                      time.sleep(
                          WRITE_DELAY
                      )

                      output = result.stdout.decode(
                          "utf-8",
                          errors="replace"
                      )

                      if not output.strip():
                          return {}

                      return json.loads(
                          output
                      )

                  last_error = result.stderr.decode(
                      "utf-8",
                      errors="replace"
                  )

                  print()
                  print(
                      f"GitHub API attempt "
                      f"{attempt}/6 failed:"
                  )
                  print(last_error)

                  time.sleep(
                      min(60, attempt * 3)
                  )

              raise RuntimeError(
                  "GitHub API request failed permanently:\n"
                  + last_error
              )


          # ========================================================
          # GET ALL COMMITS
          # ========================================================

          print()
          print("========================================")
          print("ANALYZING SOURCE REPOSITORY")
          print("========================================")

          commit_lines = git(
              "rev-list",
              "--all",
              "--topo-order",
              "--reverse"
          ).splitlines()

          commits = []

          for commit in commit_lines:

              commit = commit.strip()

              if commit and commit not in commits:
                  commits.append(commit)


          object_lines = git(
              "rev-list",
              "--objects",
              "--all"
          ).splitlines()

          all_objects = []

          for line in object_lines:

              sha = line.split(
                  " ",
                  1
              )[0]

              if sha not in all_objects:
                  all_objects.append(sha)


          print(
              f"Commits : {len(commits)}"
          )

          print(
              f"Objects : {len(all_objects)}"
          )


          # ========================================================
          # CHECK LFS
          # ========================================================

          print()
          print("Checking Git LFS...")

          lfs_detected = False

          try:

              lfs_output = subprocess.run(
                  [
                      "git",
                      "lfs",
                      "ls-files",
                      "--all"
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False
              )

              if lfs_output.returncode == 0:

                  if lfs_output.stdout.strip():

                      lfs_detected = True

                      print()
                      print(
                          "WARNING: Git LFS files detected."
                      )

                      print(
                          "Git LFS pointer files will be "
                          "preserved."
                      )

                      print(
                          "Separate LFS objects are not "
                          "copied by this workflow."
                      )

          except Exception:

              pass


          # ========================================================
          # BLOB MAP
          # ========================================================

          blob_map = {}


          # ========================================================
          # UPLOAD BLOBS
          # ========================================================

          print()
          print("========================================")
          print("UPLOADING BLOBS")
          print("========================================")

          blob_objects = []

          for sha in all_objects:

              object_type = git(
                  "cat-file",
                  "-t",
                  sha
              ).strip()

              if object_type == "blob":

                  blob_objects.append(
                      sha
                  )


          print(
              f"Blobs found: {len(blob_objects)}"
          )


          for index, blob_sha in enumerate(
              blob_objects,
              start=1
          ):

              data = git_bytes(
                  "cat-file",
                  "blob",
                  blob_sha
              )

              size = len(data)

              print(
                  f"[{index}/{len(blob_objects)}] "
                  f"Blob {blob_sha} "
                  f"({size} bytes)"
              )


              if size > 100 * 1024 * 1024:

                  raise RuntimeError(
                      f"Blob {blob_sha} is larger than "
                      "100 MiB."
                  )


              encoded = base64.b64encode(
                  data
              ).decode(
                  "ascii"
              )


              response = github_api(
                  "POST",
                  f"repos/{OWNER}/{REPO}/git/blobs",
                  {
                      "content": encoded,
                      "encoding": "base64"
                  }
              )


              destination_sha = response["sha"]


              if destination_sha != blob_sha:

                  raise RuntimeError(
                      "\nBLOB SHA MISMATCH\n"
                      f"Source      : {blob_sha}\n"
                      f"Destination : {destination_sha}"
                  )


              blob_map[blob_sha] = (
                  destination_sha
              )


          print()
          print("All blobs uploaded successfully.")


          # ========================================================
          # TREE CREATION
          # ========================================================

          tree_map = {}


          def get_tree_entries(
              tree_sha
          ):

              raw = git_bytes(
                  "ls-tree",
                  "-r",
                  "-z",
                  "--full-tree",
                  tree_sha
              )

              entries = []


              for item in raw.split(
                  b"\0"
              ):

                  if not item:
                      continue


                  header, pathname = (
                      item.split(
                          b"\t",
                          1
                      )
                  )


                  fields = header.decode(
                      "utf-8"
                  ).split(
                      " "
                  )


                  mode = fields[0]
                  object_type = fields[1]
                  sha = fields[2]


                  path = pathname.decode(
                      "utf-8"
                  )


                  if object_type == "blob":

                      if sha not in blob_map:

                          raise RuntimeError(
                              f"Blob {sha} was not uploaded."
                          )

                      destination_sha = (
                          blob_map[sha]
                      )

                      entry_type = "blob"

                  elif object_type == "commit":

                      # Git submodule.
                      destination_sha = sha
                      entry_type = "commit"

                  else:

                      raise RuntimeError(
                          f"Unsupported tree object type: "
                          f"{object_type}"
                      )


                  entries.append(
                      {
                          "path": path,
                          "mode": mode,
                          "type": entry_type,
                          "sha": destination_sha
                      }
                  )


              return entries


          def create_tree(
              source_tree_sha
          ):

              if source_tree_sha in tree_map:

                  return tree_map[
                      source_tree_sha
                  ]


              print(
                  f"Creating tree "
                  f"{source_tree_sha}"
              )


              entries = get_tree_entries(
                  source_tree_sha
              )


              response = github_api(
                  "POST",
                  f"repos/{OWNER}/{REPO}/git/trees",
                  {
                      "tree": entries
                  }
              )


              destination_sha = response["sha"]


              if destination_sha != source_tree_sha:

                  raise RuntimeError(
                      "\nTREE SHA MISMATCH\n"
                      f"Source      : {source_tree_sha}\n"
                      f"Destination : {destination_sha}\n"
                      "\n"
                      "The source tree could not be "
                      "recreated byte-for-byte."
                  )


              tree_map[source_tree_sha] = (
                  destination_sha
              )


              return destination_sha


          # ========================================================
          # PARSE COMMIT OBJECT
          # ========================================================

          def parse_commit(
              commit_sha
          ):

              raw = git_bytes(
                  "cat-file",
                  "commit",
                  commit_sha
              ).decode(
                  "utf-8",
                  errors="replace"
              )


              header_text, message = (
                  raw.split(
                      "\n\n",
                      1
                  )
              )


              headers = []

              current = None


              for line in header_text.splitlines():

                  # Continuation line for gpgsig.
                  if (
                      line.startswith(" ")
                      and current is not None
                  ):

                      current[1] += "\n" + line[1:]
                      continue


                  if " " not in line:

                      continue


                  key, value = line.split(
                      " ",
                      1
                  )


                  current = [
                      key,
                      value
                  ]


                  headers.append(
                      current
                  )


              values = {}

              for key, value in headers:

                  if key != "gpgsig":

                      values.setdefault(
                          key,
                          []
                      ).append(value)


              signature = None


              for key, value in headers:

                  if key == "gpgsig":

                      signature = value

                      break


              tree = values["tree"][0]


              parents = values.get(
                  "parent",
                  []
              )


              author = values["author"][0]

              committer = values[
                  "committer"
              ][0]


              def parse_identity(
                  value
              ):

                  match = re.match(
                      r"^(.*) <([^>]+)> ([0-9]+) ([+-][0-9]{4})$",
                      value
                  )


                  if not match:

                      raise RuntimeError(
                          "Unable to parse Git identity: "
                          + value
                      )


                  name = match.group(1)
                  email = match.group(2)
                  timestamp = int(
                      match.group(3)
                  )
                  timezone = match.group(4)


                  sign = 1

                  if timezone[0] == "-":
                      sign = -1


                  hours = int(
                      timezone[1:3]
                  )

                  minutes = int(
                      timezone[3:5]
                  )


                  offset_seconds = (
                      sign *
                      (
                          hours * 3600
                          +
                          minutes * 60
                      )
                  )


                  import datetime


                  dt = (
                      datetime.datetime.fromtimestamp(
                          timestamp,
                          datetime.timezone.utc
                      )
                      + datetime.timedelta(
                          seconds=offset_seconds
                      )
                  )


                  iso = (
                      dt.strftime(
                          "%Y-%m-%dT%H:%M:%S"
                      )
                      + timezone[:3]
                      + ":"
                      + timezone[3:]
                  )


                  return {
                      "name": name,
                      "email": email,
                      "date": iso
                  }


              author_data = parse_identity(
                  author
              )


              committer_data = parse_identity(
                  committer
              )


              return {
                  "tree": tree,
                  "parents": parents,
                  "author": author_data,
                  "committer": committer_data,
                  "message": message,
                  "signature": signature
              }


          # ========================================================
          # CREATE COMMITS
          # ========================================================

          commit_map = {}


          print()
          print("========================================")
          print("RECREATING COMMITS")
          print("========================================")


          for index, commit_sha in enumerate(
              commits,
              start=1
          ):

              print()
              print(
                  f"[{index}/{len(commits)}] "
                  f"Commit {commit_sha}"
              )


              commit_data = parse_commit(
                  commit_sha
              )


              source_tree = (
                  commit_data["tree"]
              )


              destination_tree = (
                  create_tree(
                      source_tree
                  )
              )


              destination_parents = []


              for parent in (
                  commit_data["parents"]
              ):

                  if parent not in commit_map:

                      raise RuntimeError(
                          f"Parent commit {parent} "
                          f"was not recreated before "
                          f"{commit_sha}."
                      )


                  destination_parents.append(
                      commit_map[parent]
                  )


              payload = {
                  "message": commit_data[
                      "message"
                  ],
                  "tree": destination_tree,
                  "parents": destination_parents,
                  "author": commit_data[
                      "author"
                  ],
                  "committer": commit_data[
                      "committer"
                  ]
              }


              # ----------------------------------------------------
              # PRESERVE GPG SIGNATURE
              # ----------------------------------------------------

              if commit_data["signature"]:

                  print(
                      "GPG signature detected."
                  )

                  payload["signature"] = (
                      commit_data["signature"]
                  )


              response = github_api(
                  "POST",
                  f"repos/{OWNER}/{REPO}/git/commits",
                  payload
              )


              destination_commit = (
                  response["sha"]
              )


              print(
                  f"Source      : {commit_sha}"
              )

              print(
                  f"Destination : {destination_commit}"
              )


              # ----------------------------------------------------
              # CRITICAL VERIFICATION
              # ----------------------------------------------------

              if destination_commit != commit_sha:

                  raise RuntimeError(
                      "\nCOMMIT SHA MISMATCH\n"
                      f"Source      : {commit_sha}\n"
                      f"Destination : {destination_commit}\n"
                      "\n"
                      "The workflow stopped because the "
                      "commit was not reproduced exactly."
                  )


              commit_map[commit_sha] = (
                  destination_commit
              )


          print()
          print(
              "All commits recreated with "
              "matching SHA values."
          )


          # ========================================================
          # RESTORE BRANCHES
          # ========================================================

          print()
          print("========================================")
          print("RESTORING BRANCHES")
          print("========================================")


          branch_lines = git(
              "for-each-ref",
              "--format=%(refname:strip=3) %(objectname)",
              "refs/remotes/origin"
          ).splitlines()


          branches = []


          for line in branch_lines:

              parts = line.split(
                  " ",
                  1
              )


              if len(parts) != 2:
                  continue


              branch_name = parts[0]
              source_sha = parts[1]


              if branch_name == "HEAD":
                  continue


              if source_sha not in commit_map:

                  raise RuntimeError(
                      f"Branch {branch_name} points "
                      f"to missing commit {source_sha}."
                  )


              branches.append(
                  (
                      branch_name,
                      source_sha
                  )
              )


          for branch_name, source_sha in branches:

              destination_sha = (
                  commit_map[source_sha]
              )


              print(
                  f"{branch_name} -> "
                  f"{destination_sha}"
              )


              if branch_name == "main":

                  github_api(
                      "PATCH",
                      f"repos/{OWNER}/{REPO}/git/refs/heads/main",
                      {
                          "sha": destination_sha,
                          "force": True
                      }
                  )

              else:

                  github_api(
                      "POST",
                      f"repos/{OWNER}/{REPO}/git/refs",
                      {
                          "ref":
                              f"refs/heads/{branch_name}",
                          "sha":
                              destination_sha
                      }
                  )


          print()
          print("All branches restored.")


          # ========================================================
          # RESTORE TAGS
          # ========================================================

          print()
          print("========================================")
          print("RESTORING TAGS")
          print("========================================")


          tag_lines = git(
              "for-each-ref",
              "--format=%(refname)%00%(objectname)%00%(objecttype)",
              "refs/tags"
          ).splitlines()


          for line in tag_lines:

              parts = line.split(
                  "\0"
              )


              if len(parts) != 3:
                  continue


              refname = parts[0]
              source_sha = parts[1]
              source_type = parts[2]


              tag_name = refname[
                  len("refs/tags/"):
              ]


              print(
                  f"Tag: {tag_name}"
              )


              # ----------------------------------------------------
              # LIGHTWEIGHT TAG
              # ----------------------------------------------------

              if source_type == "commit":

                  if source_sha not in commit_map:

                      raise RuntimeError(
                          f"Tag {tag_name} points to "
                          f"missing commit {source_sha}."
                      )


                  destination_sha = (
                      commit_map[source_sha]
                  )


                  github_api(
                      "POST",
                      f"repos/{OWNER}/{REPO}/git/refs",
                      {
                          "ref":
                              f"refs/tags/{tag_name}",
                          "sha":
                              destination_sha
                      }
                  )


              # ----------------------------------------------------
              # ANNOTATED TAG
              # ----------------------------------------------------

              elif source_type == "tag":

                  raw_tag = git(
                      "cat-file",
                      "tag",
                      source_sha
                  )


                  # GitHub's tag creation API does not expose
                  # a signature input field. Therefore a signed
                  # annotated tag cannot be recreated byte-for-byte
                  # through this API.
                  if (
                      "-----BEGIN PGP SIGNATURE-----"
                      in raw_tag
                  ):

                      raise RuntimeError(
                          f"Annotated tag '{tag_name}' "
                          "contains a PGP signature.\n"
                          "\n"
                          "GitHub's REST tag API does not provide "
                          "a signature parameter for creating "
                          "signed tag objects.\n"
                          "\n"
                          "The workflow stopped instead of "
                          "silently converting the signed tag."
                      )


                  target_sha = git(
                      "rev-parse",
                      f"{refname}^{{}}"
                  ).strip()


                  if target_sha not in commit_map:

                      raise RuntimeError(
                          f"Annotated tag {tag_name} "
                          f"points to missing commit "
                          f"{target_sha}."
                      )


                  destination_target = (
                      commit_map[target_sha]
                  )


                  tag_header = None
                  tagger_name = None
                  tagger_email = None
                  tagger_date = None


                  message_started = False
                  message_lines = []


                  for raw_line in (
                      raw_tag.splitlines()
                  ):

                      if raw_line.startswith(
                          "tag "
                      ):

                          tag_header = (
                              raw_line[4:]
                          )


                      elif raw_line.startswith(
                          "tagger "
                      ):

                          value = raw_line[
                              len("tagger "):
                          ]


                          match = re.match(
                              r"^(.*) <([^>]+)> (.*)$",
                              value
                          )


                          if not match:

                              raise RuntimeError(
                                  f"Could not parse tagger "
                                  f"for {tag_name}"
                              )


                          tagger_name = (
                              match.group(1)
                          )

                          tagger_email = (
                              match.group(2)
                          )

                          tagger_date = (
                              match.group(3)
                          )


                      elif raw_line == "":

                          message_started = True


                      elif message_started:

                          message_lines.append(
                              raw_line
                          )


                  if tag_header is None:

                      tag_header = tag_name


                  tag_message = (
                      "\n".join(
                          message_lines
                      )
                  )


                  tag_response = github_api(
                      "POST",
                      f"repos/{OWNER}/{REPO}/git/tags",
                      {
                          "tag":
                              tag_header,
                          "message":
                              tag_message,
                          "object":
                              destination_target,
                          "type":
                              "commit",
                          "tagger": {
                              "name":
                                  tagger_name,
                              "email":
                                  tagger_email,
                              "date":
                                  tagger_date
                          }
                      }
                  )


                  destination_tag_sha = (
                      tag_response["sha"]
                  )


                  github_api(
                      "POST",
                      f"repos/{OWNER}/{REPO}/git/refs",
                      {
                          "ref":
                              f"refs/tags/{tag_name}",
                          "sha":
                              destination_tag_sha
                      }
                  )


              else:

                  raise RuntimeError(
                      f"Unsupported tag type: "
                      f"{source_type}"
                  )


          print()
          print("All supported tags restored.")


          # ========================================================
          # FINAL MAIN BRANCH VERIFICATION
          # ========================================================

          print()
          print("========================================")
          print("FINAL VERIFICATION")
          print("========================================")


          source_main = git(
              "rev-parse",
              "refs/remotes/origin/main"
          ).strip()


          result = subprocess.run(
              [
                  "gh",
                  "api",
                  f"repos/{OWNER}/{REPO}/git/ref/heads/main",
                  "--jq",
                  ".object.sha"
              ],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              check=False
          )


          if result.returncode != 0:

              print(result.stderr)

              raise RuntimeError(
                  "Could not read backup main branch."
              )


          backup_main = result.stdout.strip()


          print(
              f"Source main : {source_main}"
          )

          print(
              f"Backup main : {backup_main}"
          )


          if source_main != backup_main:

              raise RuntimeError(
                  "\nFINAL VERIFICATION FAILED\n"
                  "Source main and backup main are different."
              )


          # ========================================================
          # VERIFY BRANCHES
          # ========================================================

          source_branch_names = {
              branch_name
              for branch_name, source_sha
              in branches
          }


          backup_branch_names = set()

          page = 1


          while True:

              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      f"repos/{OWNER}/{REPO}/branches"
                      f"?per_page=100&page={page}"
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False
              )


              if result.returncode != 0:

                  print(result.stderr)

                  raise RuntimeError(
                      "Could not list backup branches."
                  )


              data = json.loads(
                  result.stdout
              )


              if not data:
                  break


              for branch in data:

                  backup_branch_names.add(
                      branch["name"]
                  )


              if len(data) < 100:
                  break


              page += 1


          print()
          print(
              f"Source branches : "
              f"{len(source_branch_names)}"
          )

          print(
              f"Backup branches : "
              f"{len(backup_branch_names)}"
          )


          missing_branches = (
              source_branch_names
              - backup_branch_names
          )


          if missing_branches:

              raise RuntimeError(
                  "Missing branches:\n"
                  + "\n".join(
                      sorted(
                          missing_branches
                      )
                  )
              )


          # ========================================================
          # SUCCESS
          # ========================================================

          print()
          print("========================================")
          print("BACKUP COMPLETED SUCCESSFULLY")
          print("========================================")

          print()
          print(
              f"Backup repository:"
          )

          print(
              f"https://github.com/"
              f"{OWNER}/{REPO}"
          )

          print()
          print(
              f"Commits migrated: "
              f"{len(commits)}"
          )

          print(
              f"Branches migrated: "
              f"{len(branches)}"
          )

          print(
              f"Tags processed: "
              f"{len(tag_lines)}"
          )

          print()
          print("========================================")

          PY

