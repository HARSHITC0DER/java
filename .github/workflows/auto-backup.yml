name: Automatic Repository Backup

on:
  push:
    branches:
      - main

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          OWNER=$(echo "$SOURCE_REPO" | cut -d/ -f1)
          REPO=$(echo "$SOURCE_REPO" | cut -d/ -f2)

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BACKUP_REPO="${REPO}-backup-${TIMESTAMP}"

          echo "Creating backup repository: $BACKUP_REPO"

          gh repo create "$OWNER/$BACKUP_REPO" \
            --private \
            --description "Automatic backup of $REPO at commit $COMMIT_SHA"

          git remote add backup \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${BACKUP_REPO}.git"

          git push backup --all
          git push backup --tags

          echo "Backup created successfully."
          echo "Backup repository: https://github.com/${OWNER}/${BACKUP_REPO}"
