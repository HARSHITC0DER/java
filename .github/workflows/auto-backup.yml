name: Automatic Repository Backup

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e

          OWNER="ARJUNC0DER"
          REPO="${SOURCE_REPO#*/}"

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BACKUP_REPO="${REPO}-backup-${TIMESTAMP}"

          echo "======================================"
          echo "Automatic Repository Backup"
          echo "======================================"
          echo "Source repository : $SOURCE_REPO"
          echo "Backup owner      : $OWNER"
          echo "Backup repository : $BACKUP_REPO"
          echo "Commit            : $COMMIT_SHA"
          echo "======================================"

          # Confirm which GitHub account owns the token
          LOGIN=$(gh api user --jq '.login')
          echo "Authenticated GitHub account: $LOGIN"

          if [ "$LOGIN" != "$OWNER" ]; then
            echo "ERROR: BACKUP_TOKEN belongs to $LOGIN, not $OWNER."
            exit 1
          fi

          # Create a new private backup repository
          gh repo create "$OWNER/$BACKUP_REPO" \
            --private \
            --description "Automatic backup of $REPO at commit $COMMIT_SHA"

          echo "Backup repository created."

          # Configure Git to authenticate every github.com HTTPS request
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          # Add the newly created repository
          git remote add backup \
            "https://github.com/${OWNER}/${BACKUP_REPO}.git"

          echo "Pushing all branches..."

          # Push all branches
          git push backup --all

          echo "Pushing all tags..."

          # Push all tags
          git push backup --tags

          echo "======================================"
          echo "BACKUP SUCCESSFUL"
          echo "======================================"
          echo "Backup repository:"
          echo "https://github.com/${OWNER}/${BACKUP_REPO}"

