name: Test Git Database API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Test Git Database API
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -e

          OWNER="ARJUNC0DER"
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          REPO="git-api-test-${TIMESTAMP}"

          echo "Creating repository..."
          
          gh repo create "$OWNER/$REPO" --private

          echo "Repository: $OWNER/$REPO"

          echo "Creating test blob..."

          BLOB_SHA=$(gh api \
            --method POST \
            "repos/${OWNER}/${REPO}/git/blobs" \
            -f content="Git Database API test" \
            -f encoding="utf-8" \
            --jq '.sha')

          echo "Blob created: $BLOB_SHA"

          echo "SUCCESS: Git Database API is working."
