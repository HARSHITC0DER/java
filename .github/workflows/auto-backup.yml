
name: Automatic Repository Backup

"on":
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e

          # GitHub account where backups will be created
          OWNER="ARJUNC0DER"

          # Get original repository name
          REPO="${SOURCE_REPO#*/}"

          # Create unique timestamp
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")

          # Create unique backup repository name
          BACKUP_REPO="${REPO}-backup-${TIMESTAMP}"

          echo "======================================"
          echo "Automatic Repository Backup"
          echo "======================================"
          echo "Source repository : $SOURCE_REPO"
          echo "Backup owner      : $OWNER"
          echo "Backup repository : $BACKUP_REPO"
          echo "Commit            : $COMMIT_SHA"
          echo "======================================"

          # Verify the token can access the ARJUNC0DER account
          gh api user --jq '.login'

          # Create a new private repository under ARJUNC0DER
          gh repo create "$OWNER/$BACKUP_REPO" \
            --private \
            --description "Automatic backup of $REPO at commit $COMMIT_SHA"

          # Configure Git authentication through GitHub CLI
          gh auth setup-git

          # Add the new backup repository as a remote
          git remote add backup \
            "https://github.com/${OWNER}/${BACKUP_REPO}.git"

          # Push all branches
          git push backup --all

          # Push all tags
          git push backup --tags

          echo "======================================"
          echo "Backup created successfully"
          echo "======================================"
          echo "Backup repository:"
          echo "https://github.com/${OWNER}/${BACKUP_REPO}"

