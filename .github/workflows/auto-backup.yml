name: Full Private Git History Backup

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  backup:
    if: github.repository == 'HARSHITC0DER/java'

    runs-on: ubuntu-latest

    env:
      SOURCE_OWNER: HARSHITC0DER
      SOURCE_REPO: java

      BACKUP_OWNER: ARJUNC0DER
      BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}

      # Keep GitHub mutations slow and serial.
      WRITE_DELAY: "2"

      # Maximum retry count for temporary API failures.
      MAX_RETRIES: "6"

    steps:

      # ============================================================
      # CHECKOUT COMPLETE HISTORY
      # ============================================================

      - name: Checkout complete Git history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # ============================================================
      # FETCH ALL BRANCHES AND TAGS
      # ============================================================

      - name: Fetch all branches and tags
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            --force

          echo "========================================"
          echo "SOURCE BRANCHES"
          echo "========================================"

          git for-each-ref \
            --format='%(refname:strip=3)' \
            refs/remotes/origin

          echo
          echo "========================================"
          echo "SOURCE TAGS"
          echo "========================================"

          git for-each-ref \
            --format='%(refname:short)' \
            refs/tags

      # ============================================================
      # CREATE NEW PRIVATE BACKUP REPOSITORY
      # ============================================================

      - name: Create private backup repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail

          TIMESTAMP="$(date -u '+%Y%m%d-%H%M%S')"

          BACKUP_REPO="java-backup-${TIMESTAMP}"

          echo "========================================"
          echo "CREATING BACKUP REPOSITORY"
          echo "========================================"

          echo "Owner : ${BACKUP_OWNER}"
          echo "Repo  : ${BACKUP_REPO}"

          gh repo create \
            "${BACKUP_OWNER}/${BACKUP_REPO}" \
            --private \
            --description \
            "Full private Git history backup of ${SOURCE_OWNER}/${SOURCE_REPO}"

          echo "BACKUP_REPO=${BACKUP_REPO}" >> "$GITHUB_ENV"

          echo
          echo "Created:"
          echo "https://github.com/${BACKUP_OWNER}/${BACKUP_REPO}"

      # ============================================================
      # INITIALIZE EMPTY REPOSITORY
      # ============================================================

      - name: Initialize backup repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INITIALIZING BACKUP REPOSITORY"
          echo "========================================"

          printf '%s\n' \
            'Temporary initialization for Git Database migration.' \
            > /tmp/backup-init.txt

          CONTENT="$(base64 -w 0 /tmp/backup-init.txt)"

          gh api \
            --method PUT \
            "repos/${BACKUP_OWNER}/${BACKUP_REPO}/contents/.backup-initialization" \
            -f message="Initialize backup repository" \
            -f content="${CONTENT}"

          echo "Initialization complete."

      # ============================================================
      # MIGRATE GIT DATABASE
      # ============================================================

      - name: Migrate complete Git history
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "STARTING GIT DATABASE MIGRATION"
          echo "========================================"

          python3 <<'PYTHON'

          import os
          import json
          import time
          import base64
          import subprocess
          from datetime import datetime, timezone


          # ==========================================================
          # CONFIG
          # ==========================================================

          SOURCE_OWNER = os.environ["SOURCE_OWNER"]
          SOURCE_REPO = os.environ["SOURCE_REPO"]

          BACKUP_OWNER = os.environ["BACKUP_OWNER"]
          BACKUP_REPO = os.environ["BACKUP_REPO"]

          TOKEN = os.environ["BACKUP_TOKEN"]

          WRITE_DELAY = float(
              os.environ.get(
                  "WRITE_DELAY",
                  "2"
              )
          )

          MAX_RETRIES = int(
              os.environ.get(
                  "MAX_RETRIES",
                  "6"
              )
          )

          API_BASE = "https://api.github.com"

          API_VERSION = "2026-03-10"

          HEADERS = [
              "-H",
              "Accept: application/vnd.github+json",

              "-H",
              f"Authorization: Bearer {TOKEN}",

              "-H",
              f"X-GitHub-Api-Version: {API_VERSION}",
          ]


          # ==========================================================
          # GIT
          # ==========================================================

          def git(
              *args,
              raw=False
          ):

              result = subprocess.run(
                  ["git", *args],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=True
              )

              if raw:
                  return result.stdout

              return result.stdout.decode(
                  "utf-8",
                  errors="replace"
              )


          # ==========================================================
          # DATE
          # ==========================================================

          def timezone_to_seconds(value):

              sign = -1 if value[0] == "-" else 1

              hours = int(
                  value[1:3]
              )

              minutes = int(
                  value[3:5]
              )

              return sign * (
                  hours * 3600
                  + minutes * 60
              )


          def git_date_to_iso(
              timestamp,
              timezone_value
          ):

              timestamp = int(timestamp)

              offset = timezone_to_seconds(
                  timezone_value
              )

              dt = datetime.fromtimestamp(
                  timestamp,
                  timezone.utc
              )

              sign = "+" if offset >= 0 else "-"

              absolute = abs(offset)

              hours = absolute // 3600

              minutes = (
                  absolute % 3600
              ) // 60

              return (
                  dt.strftime(
                      "%Y-%m-%dT%H:%M:%S"
                  )
                  + f"{sign}{hours:02d}:{minutes:02d}"
              )


          # ==========================================================
          # GITHUB API
          # ==========================================================

          def api(
              method,
              endpoint,
              payload=None,
              mutation=False
          ):

              url = API_BASE + endpoint

              for attempt in range(
                  1,
                  MAX_RETRIES + 1
              ):

                  command = [
                      "curl",
                      "-sS",
                      "-L",
                      "-X",
                      method,
                      *HEADERS,
                      "-w",
                      "\n__STATUS__:%{http_code}\n"
                  ]

                  if payload is not None:

                      command.extend([
                          "-H",
                          "Content-Type: application/json",
                          "--data",
                          json.dumps(
                              payload,
                              separators=(
                                  ",",
                                  ":"
                              )
                          )
                      ])

                  command.append(url)

                  result = subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True
                  )

                  if result.returncode != 0:

                      if attempt == MAX_RETRIES:

                          raise RuntimeError(
                              "curl failed:\n"
                              + result.stderr
                          )

                      wait = min(
                          120,
                          5 * (2 ** (attempt - 1))
                      )

                      print(
                          f"curl error. "
                          f"Waiting {wait}s..."
                      )

                      time.sleep(wait)

                      continue

                  output = result.stdout

                  marker = "\n__STATUS__:"

                  if marker not in output:

                      if attempt == MAX_RETRIES:

                          raise RuntimeError(
                              "Invalid GitHub response:\n"
                              + output
                          )

                      time.sleep(
                          min(
                              120,
                              5 * (2 ** (attempt - 1))
                          )
                      )

                      continue

                  body, status_text = output.rsplit(
                      marker,
                      1
                  )

                  status = int(
                      status_text.strip()
                  )

                  try:

                      data = (
                          json.loads(body)
                          if body.strip()
                          else {}
                      )

                  except Exception:

                      data = {
                          "raw": body
                      }

                  # --------------------------------------------------
                  # SUCCESS
                  # --------------------------------------------------

                  if 200 <= status < 300:

                      if mutation:

                          time.sleep(
                              WRITE_DELAY
                          )

                      return data

                  message = ""

                  if isinstance(
                      data,
                      dict
                  ):

                      message = str(
                          data.get(
                              "message",
                              ""
                          )
                      )

                  # --------------------------------------------------
                  # RETRYABLE
                  # --------------------------------------------------

                  retryable = status in (
                      403,
                      409,
                      422,
                      429,
                      500,
                      502,
                      503,
                      504
                  )

                  if retryable:

                      if attempt == MAX_RETRIES:

                          raise RuntimeError(
                              "\n"
                              "GitHub API failed.\n"
                              f"HTTP: {status}\n"
                              f"Endpoint: {endpoint}\n"
                              f"Message: {message}\n"
                              f"Response:\n"
                              f"{json.dumps(data, indent=2)}"
                          )

                      # GitHub recommends at least one minute
                      # for secondary-limit failures when no
                      # Retry-After is supplied.
                      if status in (
                          403,
                          429
                      ):

                          wait = max(
                              60,
                              10 * (
                                  2 ** (
                                      attempt - 1
                                  )
                              )
                          )

                      else:

                          wait = min(
                              120,
                              10 * (
                                  2 ** (
                                      attempt - 1
                                  )
                              )
                          )

                      print()
                      print(
                          f"GitHub API HTTP {status}"
                      )

                      print(
                          f"Message: {message}"
                      )

                      print(
                          f"Retry "
                          f"{attempt}/{MAX_RETRIES} "
                          f"after {wait}s..."
                      )

                      time.sleep(
                          wait
                      )

                      continue

                  # --------------------------------------------------
                  # PERMANENT FAILURE
                  # --------------------------------------------------

                  raise RuntimeError(
                      "\n"
                      "GitHub API error.\n"
                      f"HTTP: {status}\n"
                      f"Endpoint: {endpoint}\n"
                      f"Message: {message}\n"
                      f"Response:\n"
                      f"{json.dumps(data, indent=2)}"
                  )

              raise RuntimeError(
                  "API retry loop terminated."
              )


          # ==========================================================
          # ANALYZE SOURCE
          # ==========================================================

          print()
          print("========================================")
          print("ANALYZING SOURCE REPOSITORY")
          print("========================================")

          commits = git(
              "rev-list",
              "--all",
              "--topo-order",
              "--reverse"
          ).splitlines()

          commits = [
              x.strip()
              for x in commits
              if x.strip()
          ]

          objects = git(
              "rev-list",
              "--objects",
              "--all"
          ).splitlines()

          print(
              f"Commits : {len(commits)}"
          )

          print(
              f"Objects : {len(objects)}"
          )


          # ==========================================================
          # FIND BLOBS
          # ==========================================================

          print()
          print("========================================")
          print("DISCOVERING BLOBS")
          print("========================================")

          blobs = []

          for line in objects:

              sha = line.split(
                  " ",
                  1
              )[0]

              try:

                  object_type = git(
                      "cat-file",
                      "-t",
                      sha
                  ).strip()

              except Exception:

                  continue

              if object_type == "blob":

                  blobs.append(
                      sha
                  )

          blobs = list(
              dict.fromkeys(
                  blobs
              )
          )

          print(
              f"Blobs found: {len(blobs)}"
          )


          # ==========================================================
          # UPLOAD BLOBS
          # ==========================================================

          print()
          print("========================================")
          print("UPLOADING BLOBS")
          print("========================================")

          for index, sha in enumerate(
              blobs,
              1
          ):

              content = git(
                  "cat-file",
                  "blob",
                  sha,
                  raw=True
              )

              encoded = base64.b64encode(
                  content
              ).decode(
                  "ascii"
              )

              print(
                  f"[{index}/{len(blobs)}] "
                  f"Blob {sha} "
                  f"({len(content)} bytes)"
              )

              response = api(
                  "POST",
                  f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/blobs",
                  {
                      "content": encoded,
                      "encoding": "base64"
                  },
                  mutation=True
              )

              remote_sha = response.get(
                  "sha"
              )

              if remote_sha != sha:

                  raise RuntimeError(
                      "\nBLOB SHA MISMATCH\n"
                      f"Source: {sha}\n"
                      f"Remote: {remote_sha}"
                  )

          print()
          print(
              "All blobs uploaded successfully."
          )


          # ==========================================================
          # PARSE COMMIT
          # ==========================================================

          def parse_commit(
              commit_sha
          ):

              raw = git(
                  "cat-file",
                  "commit",
                  commit_sha,
                  raw=True
              ).decode(
                  "utf-8",
                  errors="replace"
              )

              if "\n\n" in raw:

                  header, message = raw.split(
                      "\n\n",
                      1
                  )

              else:

                  header = raw
                  message = ""

              tree_sha = None

              parents = []

              author_name = None
              author_email = None
              author_timestamp = None
              author_timezone = None

              committer_name = None
              committer_email = None
              committer_timestamp = None
              committer_timezone = None

              signature_lines = []

              lines = header.splitlines()

              i = 0

              while i < len(lines):

                  line = lines[i]

                  if line.startswith(
                      "tree "
                  ):

                      tree_sha = line[
                          5:
                      ].strip()

                      i += 1

                      continue

                  if line.startswith(
                      "parent "
                  ):

                      parents.append(
                          line[
                              7:
                          ].strip()
                      )

                      i += 1

                      continue

                  if line.startswith(
                      "author "
                  ):

                      value = line[
                          7:
                      ]

                      identity, timestamp, timezone_value = (
                          value.rsplit(
                              " ",
                              2
                          )
                      )

                      name, email = identity.rsplit(
                          " <",
                          1
                      )

                      author_name = name
                      author_email = email.rstrip(
                          ">"
                      )

                      author_timestamp = timestamp
                      author_timezone = timezone_value

                      i += 1

                      continue

                  if line.startswith(
                      "committer "
                  ):

                      value = line[
                          10:
                      ]

                      identity, timestamp, timezone_value = (
                          value.rsplit(
                              " ",
                              2
                          )
                      )

                      name, email = identity.rsplit(
                          " <",
                          1
                      )

                      committer_name = name
                      committer_email = email.rstrip(
                          ">"
                      )

                      committer_timestamp = timestamp
                      committer_timezone = timezone_value

                      i += 1

                      continue

                  # ------------------------------------------------
                  # PGP SIGNATURE
                  # ------------------------------------------------

                  if line.startswith(
                      "gpgsig "
                  ):

                      signature_lines.append(
                          line[
                              7:
                          ]
                      )

                      i += 1

                      while i < len(lines):

                          continuation = lines[i]

                          if not continuation.startswith(
                              " "
                          ):

                              break

                          signature_lines.append(
                              continuation[1:]
                          )

                          i += 1

                      continue

                  i += 1

              if tree_sha is None:

                  raise RuntimeError(
                      f"Commit {commit_sha} "
                      "has no tree."
                  )

              if author_name is None:

                  raise RuntimeError(
                      f"Commit {commit_sha} "
                      "has no author."
                  )

              if committer_name is None:

                  raise RuntimeError(
                      f"Commit {commit_sha} "
                      "has no committer."
                  )

              signature = None

              if signature_lines:

                  signature = "\n".join(
                      signature_lines
                  )

                  if (
                      "-----BEGIN PGP SIGNATURE-----"
                      not in signature
                  ):

                      raise RuntimeError(
                          "\n"
                          "NON-PGP SIGNATURE FOUND\n"
                          f"Commit: {commit_sha}\n"
                          "Exact REST reconstruction "
                          "is only implemented for PGP "
                          "signatures."
                      )

              return {
                  "tree": tree_sha,

                  "parents": parents,

                  "message": message,

                  "author": {
                      "name": author_name,
                      "email": author_email,
                      "date": git_date_to_iso(
                          author_timestamp,
                          author_timezone
                      )
                  },

                  "committer": {
                      "name": committer_name,
                      "email": committer_email,
                      "date": git_date_to_iso(
                          committer_timestamp,
                          committer_timezone
                      )
                  },

                  "signature": signature
              }


          # ==========================================================
          # DISCOVER UNIQUE TREES
          # ==========================================================

          print()
          print("========================================")
          print("DISCOVERING TREES")
          print("========================================")

          tree_shas = []

          for commit_sha in commits:

              tree_sha = git(
                  "rev-parse",
                  f"{commit_sha}^{{tree}}"
              ).strip()

              tree_shas.append(
                  tree_sha
              )

          tree_shas = list(
              dict.fromkeys(
                  tree_shas
              )
          )

          print(
              f"Trees found: {len(tree_shas)}"
          )


          # ==========================================================
          # RECREATE TREES
          # ==========================================================

          print()
          print("========================================")
          print("RECREATING TREES")
          print("========================================")

          tree_map = {}

          for index, tree_sha in enumerate(
              tree_shas,
              1
          ):

              print(
                  f"[{index}/{len(tree_shas)}] "
                  f"Tree {tree_sha}"
              )

              entries = []

              raw_tree = git(
                  "ls-tree",
                  "-r",
                  "-z",
                  "--full-tree",
                  tree_sha,
                  raw=True
              )

              records = raw_tree.split(
                  b"\x00"
              )

              for record in records:

                  if not record:
                      continue

                  tab = record.find(
                      b"\t"
                  )

                  if tab == -1:
                      continue

                  left = record[
                      :tab
                  ]

                  path_bytes = record[
                      tab + 1:
                  ]

                  path = path_bytes.decode(
                      "utf-8",
                      errors="surrogateescape"
                  )

                  parts = left.split(
                      b" ",
                      2
                  )

                  if len(parts) != 3:
                      continue

                  mode = parts[0].decode(
                      "ascii"
                  )

                  object_type = parts[1].decode(
                      "ascii"
                  )

                  object_sha = parts[2].decode(
                      "ascii"
                  )

                  if object_type == "blob":

                      entries.append({
                          "path": path,
                          "mode": mode,
                          "type": "blob",
                          "sha": object_sha
                      })

                  elif object_type == "commit":

                      entries.append({
                          "path": path,
                          "mode": mode,
                          "type": "commit",
                          "sha": object_sha
                      })

              response = api(
                  "POST",
                  f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/trees",
                  {
                      "tree": entries
                  },
                  mutation=True
              )

              remote_tree = response.get(
                  "sha"
              )

              if remote_tree != tree_sha:

                  raise RuntimeError(
                      "\nTREE SHA MISMATCH\n"
                      f"Source: {tree_sha}\n"
                      f"Remote: {remote_tree}\n"
                      f"Entries: {len(entries)}"
                  )

              tree_map[
                  tree_sha
              ] = remote_tree

          print()
          print(
              "All trees recreated successfully."
          )


          # ==========================================================
          # RECREATE COMMITS
          # ==========================================================

          print()
          print("========================================")
          print("RECREATING COMMITS")
          print("========================================")

          commit_map = {}

          for index, source_sha in enumerate(
              commits,
              1
          ):

              print(
                  f"[{index}/{len(commits)}] "
                  f"Commit {source_sha}"
              )

              parsed = parse_commit(
                  source_sha
              )

              parents = []

              for parent in parsed[
                  "parents"
              ]:

                  if parent not in commit_map:

                      raise RuntimeError(
                          f"Parent {parent} "
                          f"was not recreated before "
                          f"{source_sha}"
                      )

                  parents.append(
                      commit_map[parent]
                  )

              payload = {
                  "message": parsed[
                      "message"
                  ],

                  "tree": tree_map[
                      parsed["tree"]
                  ],

                  "parents": parents,

                  "author": parsed[
                      "author"
                  ],

                  "committer": parsed[
                      "committer"
                  ]
              }

              if parsed[
                  "signature"
              ] is not None:

                  payload[
                      "signature"
                  ] = parsed[
                      "signature"
                  ]

              response = api(
                  "POST",
                  f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/commits",
                  payload,
                  mutation=True
              )

              remote_sha = response.get(
                  "sha"
              )

              if remote_sha != source_sha:

                  raise RuntimeError(
                      "\n"
                      "========================================\n"
                      "COMMIT SHA MISMATCH\n"
                      "========================================\n"
                      f"Source: {source_sha}\n"
                      f"Remote: {remote_sha}\n"
                      f"Signed: "
                      f"{parsed['signature'] is not None}\n"
                      "========================================"
                  )

              commit_map[
                  source_sha
              ] = remote_sha

          print()
          print(
              f"All {len(commit_map)} commits recreated."
          )


          # ==========================================================
          # RESTORE BRANCHES
          # ==========================================================

          print()
          print("========================================")
          print("RESTORING BRANCHES")
          print("========================================")

          branches = []

          branch_lines = git(
              "for-each-ref",
              "--format=%(refname)",
              "refs/remotes/origin"
          ).splitlines()

          for ref in branch_lines:

              prefix = (
                  "refs/remotes/origin/"
              )

              if not ref.startswith(
                  prefix
              ):
                  continue

              branch = ref[
                  len(prefix):
              ]

              if branch == "HEAD":
                  continue

              branches.append(
                  branch
              )

          branches = list(
              dict.fromkeys(
                  branches
              )
          )

          print(
              f"Branches: {len(branches)}"
          )

          for branch in branches:

              source_sha = git(
                  "rev-parse",
                  f"refs/remotes/origin/{branch}"
              ).strip()

              remote_sha = commit_map.get(
                  source_sha
              )

              if remote_sha is None:

                  raise RuntimeError(
                      f"Could not map branch "
                      f"{branch} commit "
                      f"{source_sha}"
                  )

              print(
                  f"{branch} -> {source_sha}"
              )

              api(
                  "POST",
                  f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/refs",
                  {
                      "ref": f"refs/heads/{branch}",
                      "sha": remote_sha
                  },
                  mutation=True
              )


          # ==========================================================
          # RESTORE TAGS
          # ==========================================================

          print()
          print("========================================")
          print("RESTORING TAGS")
          print("========================================")

          tag_lines = git(
              "for-each-ref",
              "--format=%(refname)%00%(objectname)%00%(objecttype)",
              "refs/tags"
          ).splitlines()

          for line in tag_lines:

              parts = line.split(
                  "\x00"
              )

              if len(parts) != 3:
                  continue

              ref_name = parts[0]

              object_sha = parts[1]

              object_type = parts[2]

              prefix = "refs/tags/"

              if not ref_name.startswith(
                  prefix
              ):
                  continue

              tag_name = ref_name[
                  len(prefix):
              ]

              print(
                  f"Tag: {tag_name}"
              )

              # ------------------------------------------------------
              # LIGHTWEIGHT TAG
              # ------------------------------------------------------

              if object_type != "tag":

                  target_sha = object_sha

                  if target_sha in commit_map:

                      target_sha = commit_map[
                          target_sha
                      ]

                  api(
                      "POST",
                      f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/refs",
                      {
                          "ref": f"refs/tags/{tag_name}",
                          "sha": target_sha
                      },
                      mutation=True
                  )

                  continue

              # ------------------------------------------------------
              # ANNOTATED TAG
              # ------------------------------------------------------

              raw_tag = git(
                  "cat-file",
                  "tag",
                  object_sha,
                  raw=True
              ).decode(
                  "utf-8",
                  errors="replace"
              )

              if "\n\n" in raw_tag:

                  tag_header, tag_message = (
                      raw_tag.split(
                          "\n\n",
                          1
                      )
                  )

              else:

                  tag_header = raw_tag
                  tag_message = ""

              target_sha = None

              tagger_name = None
              tagger_email = None
              tagger_timestamp = None
              tagger_timezone = None

              for line2 in tag_header.splitlines():

                  if line2.startswith(
                      "object "
                  ):

                      target_sha = line2[
                          7:
                      ].strip()

                  elif line2.startswith(
                      "tagger "
                  ):

                      value = line2[
                          7:
                      ]

                      identity, timestamp, timezone_value = (
                          value.rsplit(
                              " ",
                              2
                          )
                      )

                      name, email = identity.rsplit(
                          " <",
                          1
                      )

                      tagger_name = name

                      tagger_email = email.rstrip(
                          ">"
                      )

                      tagger_timestamp = timestamp

                      tagger_timezone = timezone_value

              # ------------------------------------------------------
              # SIGNED ANNOTATED TAG
              # ------------------------------------------------------

              if (
                  "-----BEGIN PGP SIGNATURE-----"
                  in tag_message
              ):

                  raise RuntimeError(
                      "\n"
                      "SIGNED ANNOTATED TAG DETECTED\n"
                      f"Tag: {tag_name}\n"
                      "\n"
                      "GitHub's REST Tag API cannot accept "
                      "a PGP signature for a newly-created "
                      "annotated tag.\n"
                      "\n"
                      "Stopping instead of silently "
                      "changing the tag.\n"
                  )

              if target_sha is None:

                  raise RuntimeError(
                      f"Tag {tag_name} "
                      "has no target object."
                  )

              if target_sha in commit_map:

                  target_sha = commit_map[
                      target_sha
                  ]

              if (
                  tagger_name is None
                  or tagger_email is None
                  or tagger_timestamp is None
                  or tagger_timezone is None
              ):

                  raise RuntimeError(
                      f"Could not parse tagger "
                      f"information for {tag_name}"
                  )

              tagger_date = git_date_to_iso(
                  tagger_timestamp,
                  tagger_timezone
              )

              response = api(
                  "POST",
                  f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/tags",
                  {
                      "tag": tag_name,
                      "message": tag_message,
                      "object": target_sha,
                      "type": "commit",
                      "tagger": {
                          "name": tagger_name,
                          "email": tagger_email,
                          "date": tagger_date
                      }
                  },
                  mutation=True
              )

              tag_object_sha = response.get(
                  "sha"
              )

              if not tag_object_sha:

                  raise RuntimeError(
                      f"No tag object SHA "
                      f"returned for {tag_name}"
                  )

              api(
                  "POST",
                  f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/refs",
                  {
                      "ref": f"refs/tags/{tag_name}",
                      "sha": tag_object_sha
                  },
                  mutation=True
              )


          # ==========================================================
          # VERIFY MAIN
          # ==========================================================

          print()
          print("========================================")
          print("VERIFYING MAIN")
          print("========================================")

          source_main = git(
              "rev-parse",
              "refs/remotes/origin/main"
          ).strip()

          remote_main_response = api(
              "GET",
              f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}"
              f"/git/ref/heads/main"
          )

          remote_main = (
              remote_main_response[
                  "object"
              ][
                  "sha"
              ]
          )

          print(
              f"Source main: {source_main}"
          )

          print(
              f"Backup main: {remote_main}"
          )

          if remote_main != source_main:

              raise RuntimeError(
                  "MAIN SHA VERIFICATION FAILED"
              )


          # ==========================================================
          # VERIFY BRANCHES
          # ==========================================================

          print()
          print("========================================")
          print("VERIFYING BRANCHES")
          print("========================================")

          remote_branches = []

          page = 1

          while True:

              response = api(
                  "GET",
                  f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}"
                  f"/branches?per_page=100&page={page}"
              )

              if not response:
                  break

              for branch in response:

                  remote_branches.append(
                      branch["name"]
                  )

              if len(response) < 100:
                  break

              page += 1

          source_set = set(
              branches
          )

          remote_set = set(
              remote_branches
          )

          if source_set != remote_set:

              missing = sorted(
                  source_set - remote_set
              )

              extra = sorted(
                  remote_set - source_set
              )

              raise RuntimeError(
                  "\nBRANCH VERIFICATION FAILED\n"
                  f"Missing: {missing}\n"
                  f"Extra: {extra}"
              )


          # ==========================================================
          # FINAL SUCCESS
          # ==========================================================

          print()
          print("========================================")
          print("BACKUP COMPLETED SUCCESSFULLY")
          print("========================================")

          print(
              f"Source : "
              f"{SOURCE_OWNER}/{SOURCE_REPO}"
          )

          print(
              f"Backup : "
              f"{BACKUP_OWNER}/{BACKUP_REPO}"
          )

          print(
              f"Commits : {len(commit_map)}"
          )

          print(
              f"Trees   : {len(tree_map)}"
          )

          print(
              f"Blobs   : {len(blobs)}"
          )

          print(
              f"Branches: {len(branches)}"
          )

          print()

          print(
              f"https://github.com/"
              f"{BACKUP_OWNER}/"
              f"{BACKUP_REPO}"
          )

          print(
              "========================================"
          )

          PYTHON

      # ============================================================
      # SUCCESS SUMMARY
      # ============================================================

