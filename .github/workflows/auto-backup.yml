name: Full Private Git History Backup

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  backup:
    # Only the original repository can run this job.
    # Backup repositories will NOT create another backup.
    if: github.repository == 'HARSHITC0DER/java'

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT COMPLETE SOURCE REPOSITORY
      # ============================================================

      - name: Checkout complete Git history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # ============================================================
      # 2. FETCH ALL BRANCHES AND TAGS
      # ============================================================

      - name: Fetch all branches and tags
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            --force

          echo "========================================"
          echo "SOURCE REPOSITORY"
          echo "========================================"

          echo "Branches:"
          git for-each-ref \
            --format='%(refname:strip=3)' \
            refs/remotes/origin

          echo
          echo "Tags:"
          git tag --list

          echo
          echo "Commit count:"
          git rev-list --all --count

          echo
          echo "========================================"

      # ============================================================
      # 3. CREATE PRIVATE BACKUP REPOSITORY
      # ============================================================

      - name: Create private backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER="ARJUNC0DER"
          SOURCE_NAME="${SOURCE_REPO#*/}"

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")

          BACKUP_REPO="${SOURCE_NAME}-backup-${TIMESTAMP}"

          echo "========================================"
          echo "FULL PRIVATE GIT BACKUP"
          echo "========================================"
          echo "Source repository : ${SOURCE_REPO}"
          echo "Backup owner      : ${OWNER}"
          echo "Backup repository : ${BACKUP_REPO}"
          echo "Source commit     : ${SOURCE_COMMIT}"
          echo "========================================"

          echo
          echo "Checking authentication..."

          LOGIN=$(gh api user --jq '.login')

          echo "Authenticated account: ${LOGIN}"

          if [ "${LOGIN}" != "${OWNER}" ]; then
            echo
            echo "ERROR:"
            echo "PAT belongs to: ${LOGIN}"
            echo "Expected:      ${OWNER}"
            exit 1
          fi

          echo
          echo "Creating private repository..."

          gh repo create "${OWNER}/${BACKUP_REPO}" \
            --private \
            --description \
            "Complete Git history backup of ${SOURCE_REPO} at ${SOURCE_COMMIT}"

          echo
          echo "Repository created:"
          echo "https://github.com/${OWNER}/${BACKUP_REPO}"

          echo
          echo "Confirming repository..."

          gh api \
            "repos/${OWNER}/${BACKUP_REPO}" \
            --jq '"Repository confirmed: " + .full_name + " | Private: " + (.private | tostring)'

          # Export for later steps.
          echo "BACKUP_OWNER=${OWNER}" >> "$GITHUB_ENV"
          echo "BACKUP_REPO=${BACKUP_REPO}" >> "$GITHUB_ENV"

      # ============================================================
      # 4. INITIALIZE EMPTY BACKUP REPOSITORY
      # ============================================================

      - name: Initialize backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INITIALIZING BACKUP REPOSITORY"
          echo "========================================"

          echo "Backup repository:"
          echo "${BACKUP_OWNER}/${BACKUP_REPO}"

          # GitHub's Git Database API returns 409 for an empty
          # repository. Create one temporary commit first.
          INIT_CONTENT=$(printf '%s' \
            "Temporary backup initialization" \
            | base64 -w 0)

          gh api \
            --method PUT \
            "repos/${BACKUP_OWNER}/${BACKUP_REPO}/contents/.backup-initialization" \
            -f message="Initialize backup repository" \
            -f content="${INIT_CONTENT}" \
            > /tmp/backup-init.json

          INIT_SHA=$(jq -r '.commit.sha' /tmp/backup-init.json)

          echo
          echo "Temporary initialization commit:"
          echo "${INIT_SHA}"

          echo
          echo "Backup repository is now initialized."

      # ============================================================
      # 5. MIGRATE GIT OBJECTS USING GITHUB GIT DATABASE API
      # ============================================================

      - name: Migrate complete Git history
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          export BACKUP_OWNER
          export BACKUP_REPO

          echo "========================================"
          echo "STARTING GIT DATABASE MIGRATION"
          echo "========================================"

          python3 <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path


          OWNER = os.environ["BACKUP_OWNER"]
          REPO = os.environ["BACKUP_REPO"]

          WORK_DIR = Path("/tmp/git-backup")
          WORK_DIR.mkdir(parents=True, exist_ok=True)

          # Small delay between write operations.
          # This repository currently has only a small number of
          # Git objects, so this is sufficient.
          WRITE_DELAY = 0.30


          # ========================================================
          # COMMAND HELPERS
          # ========================================================

          def run_command(command, input_data=None):

              result = subprocess.run(
                  command,
                  input=input_data,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False
              )

              if result.returncode != 0:

                  print()
                  print("COMMAND FAILED:")
                  print(" ".join(command))
                  print()

                  print(
                      result.stderr.decode(
                          "utf-8",
                          errors="replace"
                      )
                  )

                  raise RuntimeError(
                      "Command failed"
                  )

              return result.stdout


          def git(*args):

              return run_command(
                  ["git", *args]
              ).decode(
                  "utf-8",
                  errors="replace"
              )


          def git_bytes(*args):

              return run_command(
                  ["git", *args]
              )


          # ========================================================
          # GITHUB API HELPER
          # ========================================================

          def github_api(
              method,
              endpoint,
              payload=None
          ):

              command = [
                  "gh",
                  "api",
                  "--method",
                  method,
                  endpoint
              ]

              if payload is not None:

                  request_file = (
                      WORK_DIR / "request.json"
                  )

                  with request_file.open(
                      "w",
                      encoding="utf-8"
                  ) as f:

                      json.dump(
                          payload,
                          f,
                          ensure_ascii=False,
                          separators=(",", ":")
                      )

                  command.extend(
                      [
                          "--input",
                          str(request_file)
                      ]
                  )

              last_error = ""

              for attempt in range(1, 7):

                  result = subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      check=False
                  )

                  if result.returncode == 0:

                      time.sleep(
                          WRITE_DELAY
                      )

                      output = result.stdout.decode(
                          "utf-8",
                          errors="replace"
                      )

                      if not output.strip():
                          return {}

                      return json.loads(
                          output
                      )

                  last_error = result.stderr.decode(
                      "utf-8",
                      errors="replace"
                  )

                  print()
                  print(
                      f"GitHub API attempt "
                      f"{attempt}/6 failed:"
                  )
                  print(last_error)

                  # Retry transient API failures.
                  time.sleep(
                      min(60, attempt * 3)
                  )

              raise RuntimeError(
                  "GitHub API request failed permanently:\n"
                  + last_error
              )


          # ========================================================
          # SOURCE OBJECT INFORMATION
          # ========================================================

          print()
          print("========================================")
          print("ANALYZING SOURCE REPOSITORY")
          print("========================================")

          commit_list = git(
              "rev-list",
              "--all",
              "--topo-order",
              "--reverse"
          ).splitlines()

          commits = []

          for commit in commit_list:

              commit = commit.strip()

              if commit and commit not in commits:
                  commits.append(commit)


          object_lines = git(
              "rev-list",
              "--objects",
              "--all"
          ).splitlines()


          all_objects = []

          for line in object_lines:

              parts = line.split(
                  " ",
                  1
              )

              sha = parts[0]

              if sha not in all_objects:
                  all_objects.append(sha)


          print(
              f"Commits : {len(commits)}"
          )

          print(
              f"Objects : {len(all_objects)}"
          )


          # ========================================================
          # DETECT SIGNED COMMITS
          # ========================================================

          print()
          print("Checking commit signatures...")

          for commit in commits:

              raw = git_bytes(
                  "cat-file",
                  "commit",
                  commit
              ).decode(
                  "utf-8",
                  errors="replace"
              )

              if "\ngpgsig " in raw:

                  raise RuntimeError(
                      f"Commit {commit} contains a "
                      "GPG signature.\n"
                      "The backup was stopped instead of "
                      "silently changing the commit."
                  )


          # ========================================================
          # BLOB MAP
          # ========================================================

          blob_map = {}


          # ========================================================
          # UPLOAD BLOBS
          # ========================================================

          print()
          print("========================================")
          print("UPLOADING BLOBS")
          print("========================================")


          blob_objects = []


          for sha in all_objects:

              object_type = git(
                  "cat-file",
                  "-t",
                  sha
              ).strip()

              if object_type == "blob":

                  blob_objects.append(
                      sha
                  )


          print(
              f"Blobs found: {len(blob_objects)}"
          )


          for index, blob_sha in enumerate(
              blob_objects,
              start=1
          ):

              data = git_bytes(
                  "cat-file",
                  "blob",
                  blob_sha
              )

              size = len(data)

              print(
                  f"[{index}/{len(blob_objects)}] "
                  f"Blob {blob_sha} "
                  f"({size} bytes)"
              )


              if size > 100 * 1024 * 1024:

                  raise RuntimeError(
                      f"Blob {blob_sha} is larger than "
                      "100 MiB.\n"
                      "GitHub's normal repository file "
                      "limit is 100 MiB."
                  )


              encoded = base64.b64encode(
                  data
              ).decode(
                  "ascii"
              )


              response = github_api(
                  "POST",
                  f"repos/{OWNER}/{REPO}/git/blobs",
                  {
                      "content": encoded,
                      "encoding": "base64"
                  }
              )


              destination_sha = response["sha"]


              if destination_sha != blob_sha:

                  raise RuntimeError(
                      "\nBLOB SHA MISMATCH\n"
                      f"Source      : {blob_sha}\n"
                      f"Destination : {destination_sha}"
                  )


              blob_map[blob_sha] = (
                  destination_sha
              )


          print()
          print("All blobs uploaded successfully.")


          # ========================================================
          # CREATE TREES
          # ========================================================

          tree_map = {}


          def get_tree_entries(
              tree_sha
          ):

              raw = git_bytes(
                  "ls-tree",
                  "-r",
                  "-z",
                  "--full-tree",
                  tree_sha
              )

              entries = []


              for item in raw.split(
                  b"\0"
              ):

                  if not item:
                      continue


                  header, pathname = (
                      item.split(
                          b"\t",
                          1
                      )
                  )


                  fields = header.decode(
                      "utf-8"
                  ).split(
                      " "
                  )


                  mode = fields[0]
                  object_type = fields[1]
                  sha = fields[2]


                  path = pathname.decode(
                      "utf-8"
                  )


                  if object_type == "blob":

                      entry_type = "blob"

                      if sha not in blob_map:

                          raise RuntimeError(
                              f"Blob {sha} used by "
                              f"tree {tree_sha} was "
                              "not uploaded."
                          )

                      destination_sha = (
                          blob_map[sha]
                      )

                  elif object_type == "commit":

                      # Git submodule.
                      entry_type = "commit"

                      # A submodule SHA belongs to the
                      # external repository. It is kept
                      # unchanged.
                      destination_sha = sha

                  else:

                      raise RuntimeError(
                          "Unexpected tree entry type: "
                          + object_type
                      )


                  entries.append(
                      {
                          "path": path,
                          "mode": mode,
                          "type": entry_type,
                          "sha": destination_sha
                      }
                  )


              return entries


          def create_tree(
              source_tree_sha
          ):

              if source_tree_sha in tree_map:

                  return tree_map[
                      source_tree_sha
                  ]


              print(
                  f"Creating tree: "
                  f"{source_tree_sha}"
              )


              entries = get_tree_entries(
                  source_tree_sha
              )


              response = github_api(
                  "POST",
                  f"repos/{OWNER}/{REPO}/git/trees",
                  {
                      "tree": entries
                  }
              )


              destination_sha = response["sha"]


              if destination_sha != source_tree_sha:

                  raise RuntimeError(
                      "\nTREE SHA MISMATCH\n"
                      f"Source      : {source_tree_sha}\n"
                      f"Destination : {destination_sha}"
                  )


              tree_map[source_tree_sha] = (
                  destination_sha
              )


              return destination_sha


          # ========================================================
          # CREATE COMMITS
          # ========================================================

          commit_map = {}


          print()
          print("========================================")
          print("RECREATING COMMITS")
          print("========================================")


          for index, commit_sha in enumerate(
              commits,
              start=1
          ):

              print()
              print(
                  f"[{index}/{len(commits)}] "
                  f"Commit {commit_sha}"
              )


              tree_sha = git(
                  "rev-parse",
                  f"{commit_sha}^{{tree}}"
              ).strip()


              destination_tree = (
                  create_tree(
                      tree_sha
                  )
              )


              parent_line = git(
                  "rev-list",
                  "--parents",
                  "-n",
                  "1",
                  commit_sha
              ).strip()


              parent_parts = (
                  parent_line.split()
              )


              source_parents = (
                  parent_parts[1:]
              )


              destination_parents = []


              for parent in source_parents:

                  if parent not in commit_map:

                      raise RuntimeError(
                          f"Parent commit {parent} "
                          f"has not been recreated "
                          f"before {commit_sha}."
                      )


                  destination_parents.append(
                      commit_map[parent]
                  )


              author_name = git(
                  "show",
                  "-s",
                  "--format=%an",
                  commit_sha
              ).rstrip("\n")


              author_email = git(
                  "show",
                  "-s",
                  "--format=%ae",
                  commit_sha
              ).rstrip("\n")


              author_date = git(
                  "show",
                  "-s",
                  "--format=%aI",
                  commit_sha
              ).rstrip("\n")


              committer_name = git(
                  "show",
                  "-s",
                  "--format=%cn",
                  commit_sha
              ).rstrip("\n")


              committer_email = git(
                  "show",
                  "-s",
                  "--format=%ce",
                  commit_sha
              ).rstrip("\n")


              committer_date = git(
                  "show",
                  "-s",
                  "--format=%cI",
                  commit_sha
              ).rstrip("\n")


              message = git_bytes(
                  "show",
                  "-s",
                  "--format=%B",
                  commit_sha
              ).decode(
                  "utf-8",
                  errors="replace"
              )


              payload = {
                  "message": message,
                  "tree": destination_tree,
                  "parents": destination_parents,
                  "author": {
                      "name": author_name,
                      "email": author_email,
                      "date": author_date
                  },
                  "committer": {
                      "name": committer_name,
                      "email": committer_email,
                      "date": committer_date
                  }
              }


              response = github_api(
                  "POST",
                  f"repos/{OWNER}/{REPO}/git/commits",
                  payload
              )


              destination_commit = (
                  response["sha"]
              )


              print(
                  f"Source      : {commit_sha}"
              )

              print(
                  f"Destination : {destination_commit}"
              )


              if destination_commit != commit_sha:

                  raise RuntimeError(
                      "\nCOMMIT SHA MISMATCH\n"
                      f"Source      : {commit_sha}\n"
                      f"Destination : {destination_commit}\n"
                      "\n"
                      "The workflow stopped rather than "
                      "creating a different history."
                  )


              commit_map[commit_sha] = (
                  destination_commit
              )


          print()
          print("All commits recreated successfully.")


          # ========================================================
          # RESTORE BRANCHES
          # ========================================================

          print()
          print("========================================")
          print("RESTORING BRANCHES")
          print("========================================")


          branch_lines = git(
              "for-each-ref",
              "--format=%(refname:strip=3) %(objectname)",
              "refs/remotes/origin"
          ).splitlines()


          branches = []


          for line in branch_lines:

              parts = line.split(
                  " ",
                  1
              )

              if len(parts) != 2:
                  continue


              branch_name = parts[0]
              source_sha = parts[1]


              if branch_name == "HEAD":
                  continue


              if source_sha not in commit_map:

                  raise RuntimeError(
                      f"Branch {branch_name} points "
                      f"to unknown commit {source_sha}."
                  )


              branches.append(
                  (
                      branch_name,
                      source_sha
                  )
              )


          for branch_name, source_sha in branches:

              destination_sha = (
                  commit_map[source_sha]
              )


              print(
                  f"{branch_name} -> "
                  f"{destination_sha}"
              )


              if branch_name == "main":

                  # main already exists because the
                  # initialization commit created it.
                  github_api(
                      "PATCH",
                      f"repos/{OWNER}/{REPO}/git/refs/heads/main",
                      {
                          "sha": destination_sha,
                          "force": True
                      }
                  )

              else:

                  github_api(
                      "POST",
                      f"repos/{OWNER}/{REPO}/git/refs",
                      {
                          "ref": (
                              f"refs/heads/{branch_name}"
                          ),
                          "sha": destination_sha
                      }
                  )


          print()
          print("All branches restored.")


          # ========================================================
          # RESTORE TAGS
          # ========================================================

          print()
          print("========================================")
          print("RESTORING TAGS")
          print("========================================")


          tag_lines = git(
              "for-each-ref",
              "--format=%(refname)%00%(objectname)%00%(objecttype)",
              "refs/tags"
          ).splitlines()


          for line in tag_lines:

              parts = line.split(
                  "\0"
              )


              if len(parts) != 3:
                  continue


              refname = parts[0]
              source_sha = parts[1]
              source_type = parts[2]


              tag_name = refname[
                  len("refs/tags/"):
              ]


              print(
                  f"Tag: {tag_name}"
              )


              # ----------------------------------------------------
              # LIGHTWEIGHT TAG
              # ----------------------------------------------------

              if source_type == "commit":

                  if source_sha not in commit_map:

                      raise RuntimeError(
                          f"Tag {tag_name} points to "
                          f"unknown commit {source_sha}."
                      )


                  destination_sha = (
                      commit_map[source_sha]
                  )


                  github_api(
                      "POST",
                      f"repos/{OWNER}/{REPO}/git/refs",
                      {
                          "ref": (
                              f"refs/tags/{tag_name}"
                          ),
                          "sha": destination_sha
                      }
                  )


              # ----------------------------------------------------
              # ANNOTATED TAG
              # ----------------------------------------------------

              elif source_type == "tag":

                  raw_tag = git(
                      "cat-file",
                      "tag",
                      source_sha
                  )


                  if (
                      "-----BEGIN PGP SIGNATURE-----"
                      in raw_tag
                  ):

                      raise RuntimeError(
                          f"Annotated tag {tag_name} "
                          "contains a PGP signature. "
                          "The workflow stopped rather "
                          "than changing the tag."
                      )


                  target_sha = git(
                      "rev-parse",
                      f"{refname}^{{}}"
                  ).strip()


                  if target_sha not in commit_map:

                      raise RuntimeError(
                          f"Annotated tag {tag_name} "
                          f"target {target_sha} was not "
                          "recreated."
                      )


                  destination_target = (
                      commit_map[target_sha]
                  )


                  tag_header = None
                  tagger_name = None
                  tagger_email = None
                  tagger_date = None


                  tag_lines_raw = (
                      raw_tag.splitlines()
                  )


                  message_started = False
                  message_lines = []


                  for raw_line in tag_lines_raw:

                      if raw_line.startswith(
                          "tag "
                      ):

                          tag_header = (
                              raw_line[4:]
                          )


                      elif raw_line.startswith(
                          "tagger "
                      ):

                          value = raw_line[
                              len("tagger "):
                          ]


                          match = re.match(
                              r"^(.*) <([^>]+)> (.*)$",
                              value
                          )


                          if not match:

                              raise RuntimeError(
                                  f"Could not parse tagger "
                                  f"for {tag_name}"
                              )


                          tagger_name = (
                              match.group(1)
                          )

                          tagger_email = (
                              match.group(2)
                          )

                          tagger_date = (
                              match.group(3)
                          )


                      elif raw_line == "":

                          message_started = True


                      elif message_started:

                          message_lines.append(
                              raw_line
                          )


                  if tag_header is None:

                      tag_header = tag_name


                  tag_message = (
                      "\n".join(
                          message_lines
                      )
                  )


                  tag_payload = {
                      "tag": tag_header,
                      "message": tag_message,
                      "object": destination_target,
                      "type": "commit",
                      "tagger": {
                          "name": tagger_name,
                          "email": tagger_email,
                          "date": tagger_date
                      }
                  }


                  tag_response = github_api(
                      "POST",
                      f"repos/{OWNER}/{REPO}/git/tags",
                      tag_payload
                  )


                  destination_tag_sha = (
                      tag_response["sha"]
                  )


                  github_api(
                      "POST",
                      f"repos/{OWNER}/{REPO}/git/refs",
                      {
                          "ref": (
                              f"refs/tags/{tag_name}"
                          ),
                          "sha": destination_tag_sha
                      }
                  )


              else:

                  raise RuntimeError(
                      f"Unsupported tag object type: "
                      f"{source_type}"
                  )


          print()
          print("All tags restored.")


          # ========================================================
          # FINAL VERIFICATION
          # ========================================================

          print()
          print("========================================")
          print("FINAL VERIFICATION")
          print("========================================")


          source_main = git(
              "rev-parse",
              "refs/remotes/origin/main"
          ).strip()


          result = subprocess.run(
              [
                  "gh",
                  "api",
                  f"repos/{OWNER}/{REPO}/git/ref/heads/main",
                  "--jq",
                  ".object.sha"
              ],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              check=False
          )


          if result.returncode != 0:

              print(result.stderr)

              raise RuntimeError(
                  "Could not read backup main branch."
              )


          backup_main = result.stdout.strip()


          print(
              f"Source main : {source_main}"
          )

          print(
              f"Backup main : {backup_main}"
          )


          if source_main != backup_main:

              raise RuntimeError(
                  "\nFINAL VERIFICATION FAILED\n"
                  "Source main and backup main are different."
              )


          # --------------------------------------------------------
          # VERIFY BRANCH COUNT
          # --------------------------------------------------------

          source_branch_names = set()


          for branch_name, source_sha in branches:

              source_branch_names.add(
                  branch_name
              )


          backup_branch_names = set()


          page = 1


          while True:

              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      f"repos/{OWNER}/{REPO}/branches"
                      f"?per_page=100&page={page}"
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  check=False
              )


              if result.returncode != 0:

                  print(result.stderr)

                  raise RuntimeError(
                      "Could not list backup branches."
                  )


              data = json.loads(
                  result.stdout
              )


              if not data:
                  break


              for branch in data:

                  backup_branch_names.add(
                      branch["name"]
                  )


              if len(data) < 100:
                  break


              page += 1


          print()
          print(
              f"Source branches : "
              f"{len(source_branch_names)}"
          )

          print(
              f"Backup branches : "
              f"{len(backup_branch_names)}"
          )


          missing_branches = (
              source_branch_names
              - backup_branch_names
          )


          if missing_branches:

              raise RuntimeError(
