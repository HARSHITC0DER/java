name: Full Git History Private Backup

"on":
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  backup:
    # ONLY the original repository can create backups.
    # Prevents backup repositories from creating more backups.
    if: github.repository == 'HARSHITC0DER/java'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete Git repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create full Git history backup
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e

          OWNER="ARJUNC0DER"
          REPO="${SOURCE_REPO#*/}"

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BACKUP_REPO="${REPO}-backup-${TIMESTAMP}"

          echo "========================================"
          echo "FULL GIT HISTORY BACKUP"
          echo "========================================"
          echo "Source repository : $SOURCE_REPO"
          echo "Backup owner      : $OWNER"
          echo "Backup repository : $BACKUP_REPO"
          echo "Current commit    : $COMMIT_SHA"
          echo "========================================"

          # Verify token account
          LOGIN=$(gh api user --jq '.login')

          echo "Authenticated account: $LOGIN"

          if [ "$LOGIN" != "$OWNER" ]; then
            echo "ERROR: BACKUP_TOKEN belongs to $LOGIN"
            echo "Expected account: $OWNER"
            exit 1
          fi

          # Create PRIVATE backup repository
          gh repo create "$OWNER/$BACKUP_REPO" \
            --private \
            --description "Full Git history backup of $REPO at $COMMIT_SHA"

          echo "Private backup repository created."

          # Verify repository
          gh api "repos/${OWNER}/${BACKUP_REPO}" \
            --jq '"Repository confirmed: " + .full_name + " | Private: " + (.private | tostring)'

          # Configure Git authentication
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

          # Remove the normal origin
          git remote remove origin || true

          # Add the new backup repository
          git remote add backup \
            "https://github.com/${OWNER}/${BACKUP_REPO}.git"

          echo "========================================"
          echo "Pushing COMPLETE Git history..."
          echo "========================================"

          # Push ALL branches
          git push backup --all

          # Push ALL tags
          git push backup --tags

          echo "========================================"
          echo "BACKUP SUCCESSFUL"
          echo "========================================"
          echo "All branches: COPIED"
          echo "All tags: COPIED"
          echo "Git history: COPIED"
          echo "Visibility: PRIVATE"
          echo "========================================"

          echo "Backup repository:"
          echo "https://github.com/${OWNER}/${BACKUP_REPO}"
