```yaml
name: Automatic Repository Backup

on:
  push:
    branches:
      - main

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Backup repositories will be created under ARJUNC0DER
          OWNER="ARJUNC0DER"

          # Get the original repository name
          REPO=$(echo "$SOURCE_REPO" | cut -d/ -f2)

          # Create a unique timestamp for every backup
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")

          # Backup repository name
          BACKUP_REPO="${REPO}-backup-${TIMESTAMP}"

          echo "Source repository: $SOURCE_REPO"
          echo "Backup owner: $OWNER"
          echo "Backup repository: $BACKUP_REPO"
          echo "Commit: $COMMIT_SHA"

          # Create a new private repository under ARJUNC0DER
          gh repo create "$OWNER/$BACKUP_REPO" \
            --private \
            --description "Automatic backup of $REPO at commit $COMMIT_SHA"

          # Add the new backup repository as a Git remote
          git remote add backup \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${BACKUP_REPO}.git"

          # Push all branches
          git push backup --all

          # Push all tags
          git push backup --tags

          echo "Backup created successfully."
          echo "Backup repository:"
          echo "https://github.com/${OWNER}/${BACKUP_REPO}"
```
