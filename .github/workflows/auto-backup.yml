name: Full Private Git History Backup

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  backup:
    # Never run this workflow from a backup repository.
    if: github.repository == 'HARSHITC0DER/java'

    runs-on: ubuntu-latest

    env:
      SOURCE_OWNER: HARSHITC0DER
      SOURCE_REPO: java
      BACKUP_OWNER: ARJUNC0DER
      BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}

      # Slow down GitHub Git-Database writes to avoid
      # secondary rate limits / anti-spam protection.
      WRITE_DELAY: "1.5"

      MAX_RETRIES: "8"

    steps:

      # ============================================================
      # CHECKOUT COMPLETE HISTORY
      # ============================================================

      - name: Checkout complete Git history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # ============================================================
      # FETCH ALL BRANCHES AND TAGS
      # ============================================================

      - name: Fetch all branches and tags
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            --force

          echo "Branches:"
          git for-each-ref \
            --format='%(refname:short)' \
            refs/remotes/origin

          echo
          echo "Tags:"
          git for-each-ref \
            --format='%(refname:short)' \
            refs/tags

      # ============================================================
      # CREATE PRIVATE BACKUP REPOSITORY
      # ============================================================

      - name: Create private backup repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail

          TIMESTAMP="$(date -u '+%Y%m%d-%H%M%S')"

          BACKUP_REPO="java-backup-${TIMESTAMP}"

          echo "Creating:"
          echo "${BACKUP_OWNER}/${BACKUP_REPO}"

          gh repo create \
            "${BACKUP_OWNER}/${BACKUP_REPO}" \
            --private \
            --description "Full private Git history backup of ${SOURCE_OWNER}/${SOURCE_REPO}"

          echo "BACKUP_REPO=${BACKUP_REPO}" >> "$GITHUB_ENV"

          echo
          echo "Backup repository created:"
          echo "https://github.com/${BACKUP_OWNER}/${BACKUP_REPO}"

      # ============================================================
      # INITIALIZE EMPTY REPOSITORY
      # ============================================================

      - name: Initialize backup repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail

          echo "Initializing backup repository..."

          printf 'Temporary initialization for Git Database migration.\n' \
            > /tmp/backup-initialization.txt

          CONTENT="$(base64 -w 0 /tmp/backup-initialization.txt)"

          gh api \
            --method PUT \
            "repos/${BACKUP_OWNER}/${BACKUP_REPO}/contents/.backup-initialization" \
            -f message="Initialize backup repository" \
            -f content="${CONTENT}"

          echo "Repository initialized."

      # ============================================================
      # MIGRATE COMPLETE GIT DATABASE
      # ============================================================

      - name: Migrate complete Git history
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail

          echo "========================================"
          echo "STARTING GIT DATABASE MIGRATION"
          echo "========================================"

          python3 <<'PYTHON'

          import os
          import sys
          import time
          import json
          import base64
          import subprocess
          from datetime import datetime, timezone


          # ==========================================================
          # CONFIGURATION
          # ==========================================================

          SOURCE_OWNER = os.environ["SOURCE_OWNER"]
          SOURCE_REPO = os.environ["SOURCE_REPO"]

          BACKUP_OWNER = os.environ["BACKUP_OWNER"]
          BACKUP_REPO = os.environ["BACKUP_REPO"]

          TOKEN = os.environ["BACKUP_TOKEN"]

          WRITE_DELAY = float(
              os.environ.get("WRITE_DELAY", "1.5")
          )

          MAX_RETRIES = int(
              os.environ.get("MAX_RETRIES", "8")
          )

          API_VERSION = "2026-03-10"

          API_BASE = "https://api.github.com"

          HEADERS = [
              "-H",
              "Accept: application/vnd.github+json",

              "-H",
              f"Authorization: Bearer {TOKEN}",

              "-H",
              f"X-GitHub-Api-Version: {API_VERSION}",
          ]


          # ==========================================================
          # GIT COMMAND
          # ==========================================================

          def git_command(*args, raw=False):

              result = subprocess.run(
                  ["git", *args],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=True
              )

              if raw:
                  return result.stdout

              return result.stdout.decode(
                  "utf-8",
                  errors="replace"
              )


          # ==========================================================
          # GITHUB API
          # ==========================================================

          def github_api(
              method,
              endpoint,
              payload=None,
              write=True
          ):

              url = API_BASE + endpoint

              for attempt in range(1, MAX_RETRIES + 1):

                  command = [
                      "curl",
                      "-sS",
                      "-L",
                      "-X",
                      method,
                      *HEADERS,
                      "-w",
                      "\n__HTTP_STATUS__:%{http_code}\n",
                  ]

                  if payload is not None:

                      command.extend([
                          "-H",
                          "Content-Type: application/json",
                          "--data",
                          json.dumps(
                              payload,
                              separators=(",", ":")
                          )
                      ])

                  command.append(url)

                  result = subprocess.run(
                      command,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True
                  )

                  if result.returncode != 0:

                      if attempt >= MAX_RETRIES:

                          raise RuntimeError(
                              "curl failed:\n"
                              + result.stderr
                          )

                      wait = min(
                          120,
                          5 * (2 ** (attempt - 1))
                      )

                      print(
                          f"curl failed. "
                          f"Retrying in {wait}s..."
                      )

                      time.sleep(wait)

                      continue

                  output = result.stdout

                  marker = "\n__HTTP_STATUS__:"

                  if marker not in output:

                      if attempt >= MAX_RETRIES:

                          raise RuntimeError(
                              "Unexpected GitHub response:\n"
                              + output
                          )

                      time.sleep(
                          min(
                              120,
                              5 * (2 ** (attempt - 1))
                          )
                      )

                      continue

                  body, status_text = output.rsplit(
                      marker,
                      1
                  )

                  status = int(
                      status_text.strip()
                  )

                  try:
                      data = (
                          json.loads(body)
                          if body.strip()
                          else {}
                      )
                  except Exception:
                      data = {
                          "raw": body
                      }

                  # --------------------------------------------------
                  # SUCCESS
                  # --------------------------------------------------

                  if 200 <= status < 300:

                      if write:
                          time.sleep(
                              WRITE_DELAY
                          )

                      return data

                  # --------------------------------------------------
                  # TEMPORARY / RATE-LIMIT / VALIDATION RETRY
                  # --------------------------------------------------

                  message = ""

                  if isinstance(data, dict):
                      message = str(
                          data.get(
                              "message",
                              ""
                          )
                      )

                  retryable = status in (
                      403,
                      409,
                      422,
                      429,
                      500,
                      502,
                      503,
                      504
                  )

                  if retryable:

                      if attempt >= MAX_RETRIES:

                          raise RuntimeError(
                              "\n"
                              "GitHub API request failed.\n"
                              f"HTTP: {status}\n"
                              f"Endpoint: {endpoint}\n"
                              f"Message: {message}\n"
                              f"Response:\n"
                              f"{json.dumps(data, indent=2)}"
                          )

                      wait = min(
                          180,
                          5 * (2 ** (attempt - 1))
                      )

                      print(
                          f"GitHub API HTTP {status}"
                      )

                      print(
                          f"Message: {message}"
                      )

                      print(
                          f"Retry "
                          f"{attempt}/{MAX_RETRIES} "
                          f"in {wait}s..."
                      )

                      time.sleep(wait)

                      continue

                  # --------------------------------------------------
                  # PERMANENT ERROR
                  # --------------------------------------------------

                  raise RuntimeError(
                      "\n"
                      "GitHub API error.\n"
                      f"HTTP: {status}\n"
                      f"Endpoint: {endpoint}\n"
                      f"Message: {message}\n"
                      f"Response:\n"
                      f"{json.dumps(data, indent=2)}"
                  )

              raise RuntimeError(
                  "GitHub API retry loop ended unexpectedly."
              )


          # ==========================================================
          # ANALYZE SOURCE
          # ==========================================================

          print()
          print("========================================")
          print("ANALYZING SOURCE REPOSITORY")
          print("========================================")

          commits = git_command(
              "rev-list",
              "--all",
              "--topo-order",
              "--reverse"
          ).splitlines()

          commits = [
              x.strip()
              for x in commits
              if x.strip()
          ]

          objects = git_command(
              "rev-list",
              "--objects",
              "--all"
          ).splitlines()

          print(
              f"Commits : {len(commits)}"
          )

          print(
              f"Objects : {len(objects)}"
          )


          # ==========================================================
          # FIND BLOBS
          # ==========================================================

          print()
          print("========================================")
          print("UPLOADING BLOBS")
          print("========================================")

          blobs = []

          for line in objects:

              sha = line.split(
                  " ",
                  1
              )[0]

              try:

                  object_type = git_command(
                      "cat-file",
                      "-t",
                      sha
                  ).strip()

              except Exception:

                  continue

              if object_type == "blob":
                  blobs.append(sha)

          blobs = list(
              dict.fromkeys(blobs)
          )

          print(
              f"Blobs found: {len(blobs)}"
          )


          # ==========================================================
          # UPLOAD BLOBS
          # ==========================================================

          for index, sha in enumerate(
              blobs,
              1
          ):

              content = git_command(
                  "cat-file",
                  "blob",
                  sha,
                  raw=True
              )

              encoded = base64.b64encode(
                  content
              ).decode("ascii")

              print(
                  f"[{index}/{len(blobs)}] "
                  f"Blob {sha} "
                  f"({len(content)} bytes)"
              )

              response = github_api(
                  "POST",
                  f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/blobs",
                  {
                      "content": encoded,
                      "encoding": "base64"
                  }
              )

              remote_sha = response.get(
                  "sha"
              )

              if remote_sha != sha:

                  raise RuntimeError(
                      "\nBLOB SHA MISMATCH\n"
                      f"Source : {sha}\n"
                      f"Remote : {remote_sha}"
                  )

          print()
          print(
              "All blobs uploaded successfully."
          )


          # ==========================================================
          # DATE HELPERS
          # ==========================================================

          def timezone_to_seconds(value):

              sign = -1 if value[0] == "-" else 1

              hours = int(
                  value[1:3]
              )

              minutes = int(
                  value[3:5]
              )

              return sign * (
                  hours * 3600
                  + minutes * 60
              )


          def git_date_to_iso(
              timestamp,
              timezone_value
          ):

              timestamp = int(
                  timestamp
              )

              offset_seconds = (
                  timezone_to_seconds(
                      timezone_value
                  )
              )

              dt = datetime.fromtimestamp(
                  timestamp,
                  timezone.utc
              )

              sign = (
                  "+"
                  if offset_seconds >= 0
                  else "-"
              )

              absolute = abs(
                  offset_seconds
              )

              hours = absolute // 3600

              minutes = (
                  absolute % 3600
              ) // 60

              return (
                  dt.strftime(
                      "%Y-%m-%dT%H:%M:%S"
                  )
                  + f"{sign}{hours:02d}:{minutes:02d}"
              )


          # ==========================================================
          # PARSE COMMIT
          # ==========================================================

          def parse_commit(
              commit_sha
          ):

              raw = git_command(
                  "cat-file",
                  "commit",
                  commit_sha,
                  raw=True
              ).decode(
                  "utf-8",
                  errors="replace"
              )

              if "\n\n" in raw:

                  header_text, message = (
                      raw.split(
                          "\n\n",
                          1
                      )
                  )

              else:

                  header_text = raw
                  message = ""

              tree_sha = None

              parents = []

              author_name = None
              author_email = None
              author_timestamp = None
              author_timezone = None

              committer_name = None
              committer_email = None
              committer_timestamp = None
              committer_timezone = None

              signature_lines = []

              lines = header_text.splitlines()

              i = 0

              while i < len(lines):

                  line = lines[i]

                  if line.startswith("tree "):

                      tree_sha = line[
                          len("tree "):
                      ].strip()

                      i += 1

                      continue

                  if line.startswith("parent "):

                      parents.append(
                          line[
                              len("parent "):
                          ].strip()
                      )

                      i += 1

                      continue

                  if line.startswith("author "):

                      value = line[
                          len("author "):
                      ]

                      identity, timestamp, timezone_value = (
                          value.rsplit(
                              " ",
                              2
                          )
                      )

                      name, email = identity.rsplit(
                          " <",
                          1
                      )

                      author_name = name
                      author_email = email.rstrip(">")
                      author_timestamp = timestamp
                      author_timezone = timezone_value

                      i += 1

                      continue

                  if line.startswith("committer "):

                      value = line[
                          len("committer "):
                      ]

                      identity, timestamp, timezone_value = (
                          value.rsplit(
                              " ",
                              2
                          )
                      )

                      name, email = identity.rsplit(
                          " <",
                          1
                      )

                      committer_name = name
                      committer_email = email.rstrip(">")
                      committer_timestamp = timestamp
                      committer_timezone = timezone_value

                      i += 1

                      continue

                  # ------------------------------------------------
                  # Signed commit
                  # ------------------------------------------------

                  if line.startswith("gpgsig "):

                      signature_lines.append(
                          line[
                              len("gpgsig "):
                          ]
                      )

                      i += 1

                      while i < len(lines):

                          continuation = lines[i]

                          if not continuation.startswith(" "):
                              break

                          signature_lines.append(
                              continuation[1:]
                          )

                          i += 1

                      continue

                  i += 1

              if tree_sha is None:

                  raise RuntimeError(
                      f"Commit {commit_sha} "
                      "has no tree."
                  )

              if author_name is None:

                  raise RuntimeError(
                      f"Commit {commit_sha} "
                      "has no author."
                  )

              if committer_name is None:

                  raise RuntimeError(
                      f"Commit {commit_sha} "
                      "has no committer."
                  )

              signature = None

              if signature_lines:

                  signature = "\n".join(
                      signature_lines
                  )

                  if (
                      "-----BEGIN PGP SIGNATURE-----"
                      not in signature
                  ):

                      raise RuntimeError(
                          "\n"
                          "NON-PGP SIGNATURE FOUND\n"
                          f"Commit: {commit_sha}\n"
                          "\n"
                          "GitHub's Create Commit API "
                          "supports PGP signatures."
                      )

              return {
                  "tree": tree_sha,

                  "parents": parents,

                  "message": message,

                  "author": {
                      "name": author_name,
                      "email": author_email,
                      "date": git_date_to_iso(
                          author_timestamp,
                          author_timezone
                      )
                  },

                  "committer": {
                      "name": committer_name,
                      "email": committer_email,
                      "date": git_date_to_iso(
                          committer_timestamp,
                          committer_timezone
                      )
                  },

                  "signature": signature
              }


          # ==========================================================
          # RECREATE TREES
          # ==========================================================

          print()
          print("========================================")
          print("RECREATING TREES")
          print("========================================")

          tree_map = {}

          for commit_index, commit_sha in enumerate(
              commits,
              1
          ):

              tree_sha = git_command(
                  "rev-parse",
                  f"{commit_sha}^{{tree}}"
              ).strip()

              if tree_sha in tree_map:
                  continue

              print(
                  f"Tree {len(tree_map) + 1}: "
                  f"{tree_sha}"
              )

              entries = []

              raw_tree = git_command(
                  "ls-tree",
                  "-r",
                  "-z",
                  "--full-tree",
                  tree_sha,
                  raw=True
              )

              records = raw_tree.split(
                  b"\x00"
              )

              for record in records:

                  if not record:
                      continue

                  separator = record.find(
                      b"\t"
                  )

                  if separator == -1:
                      continue

                  left = record[
                      :separator
                  ]

                  path_bytes = record[
                      separator + 1:
                  ]

                  path = path_bytes.decode(
                      "utf-8",
                      errors="surrogateescape"
                  )

                  parts = left.split(
                      b" ",
                      2
                  )

                  if len(parts) != 3:
                      continue

                  mode = parts[0].decode(
                      "ascii"
                  )

                  object_type = parts[1].decode(
                      "ascii"
                  )

                  object_sha = parts[2].decode(
                      "ascii"
                  )

                  if object_type == "blob":

                      entries.append({
                          "path": path,
                          "mode": mode,
                          "type": "blob",
                          "sha": object_sha
                      })

                  elif object_type == "commit":

                      entries.append({
                          "path": path,
                          "mode": mode,
                          "type": "commit",
                          "sha": object_sha
                      })

              response = github_api(
                  "POST",
                  f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/trees",
                  {
                      "tree": entries
                  }
              )

              remote_tree_sha = response.get(
                  "sha"
              )

              if remote_tree_sha != tree_sha:

                  raise RuntimeError(
                      "\nTREE SHA MISMATCH\n"
                      f"Source tree : {tree_sha}\n"
                      f"Remote tree : {remote_tree_sha}\n"
                      f"Commit      : {commit_sha}\n"
                      f"Entries     : {len(entries)}"
                  )

              tree_map[
                  tree_sha
              ] = remote_tree_sha

          print()
          print(
              f"All trees recreated: "
              f"{len(tree_map)}"
          )


          # ==========================================================
          # RECREATE COMMITS
          # ==========================================================

          print()
          print("========================================")
          print("RECREATING COMMITS")
          print("========================================")

          commit_map = {}

          for index, source_sha in enumerate(
              commits,
              1
          ):

              print(
                  f"[{index}/{len(commits)}] "
                  f"Commit {source_sha}"
              )

              parsed = parse_commit(
                  source_sha
              )

              source_tree = parsed[
                  "tree"
              ]

              if source_tree not in tree_map:

                  raise RuntimeError(
                      f"Tree {source_tree} "
                      f"was not recreated."
                  )

              parent_shas = []

              for parent in parsed[
                  "parents"
              ]:

                  if parent not in commit_map:

                      raise RuntimeError(
                          f"Parent {parent} "
                          f"for commit {source_sha} "
                          f"has not been recreated."
                      )

                  parent_shas.append(
                      commit_map[parent]
                  )

              payload = {
                  "message": parsed[
                      "message"
                  ],

                  "tree": tree_map[
                      source_tree
                  ],

                  "parents": parent_shas,

                  "author": parsed[
                      "author"
                  ],

                  "committer": parsed[
                      "committer"
                  ]
              }

              if parsed[
                  "signature"
              ] is not None:

                  payload[
                      "signature"
                  ] = parsed[
                      "signature"
                  ]

              response = github_api(
                  "POST",
                  f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/commits",
                  payload
              )

              remote_sha = response.get(
                  "sha"
              )

              if remote_sha != source_sha:

                  verification = response.get(
                      "verification",
                      {}
                  )

                  raise RuntimeError(
                      "\n"
                      "========================================\n"
                      "COMMIT SHA MISMATCH\n"
                      "========================================\n"
                      f"Source commit : {source_sha}\n"
                      f"Remote commit : {remote_sha}\n"
                      f"Tree          : {source_tree}\n"
                      f"Signed        : "
                      f"{parsed['signature'] is not None}\n"
                      f"Verification  : "
                      f"{json.dumps(verification)}\n"
                      "========================================"
                  )

              commit_map[
                  source_sha
              ] = remote_sha

          print()
          print(
              f"All commits recreated: "
              f"{len(commit_map)}"
          )


          # ==========================================================
          # RESTORE BRANCHES
          # ==========================================================

          print()
          print("========================================")
          print("RESTORING BRANCHES")
          print("========================================")

          branch_lines = git_command(
              "for-each-ref",
              "--format=%(refname:strip=3)",
              "refs/remotes/origin"
          ).splitlines()

          branches = []

          for branch in branch_lines:

              branch = branch.strip()

              if not branch:
                  continue

              if branch == "HEAD":
                  continue

              branches.append(
                  branch
              )

          branches = list(
              dict.fromkeys(
                  branches
              )
          )

          print(
              f"Branches found: "
              f"{len(branches)}"
          )

          for branch in branches:

              source_ref = (
                  f"refs/remotes/origin/"
                  f"{branch}"
              )

              source_sha = git_command(
                  "rev-parse",
                  source_ref
              ).strip()

              remote_sha = commit_map.get(
                  source_sha
              )

              if remote_sha is None:

                  raise RuntimeError(
                      f"Branch {branch} "
                      f"points to unknown commit "
                      f"{source_sha}"
                  )

              print(
                  f"{branch} -> {source_sha}"
              )

              github_api(
                  "POST",
                  f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/refs",
                  {
                      "ref": f"refs/heads/{branch}",
                      "sha": remote_sha
                  }
              )


          # ==========================================================
          # RESTORE TAGS
          # ==========================================================

          print()
          print("========================================")
          print("RESTORING TAGS")
          print("========================================")

          tag_lines = git_command(
              "for-each-ref",
              "--format=%(refname)%00%(objectname)%00%(objecttype)",
              "refs/tags"
          ).splitlines()

          for line in tag_lines:

              if not line:
                  continue

              parts = line.split(
                  "\x00"
              )

              if len(parts) != 3:
                  continue

              full_ref = parts[0]

              object_sha = parts[1]

              object_type = parts[2]

              prefix = "refs/tags/"

              if not full_ref.startswith(
                  prefix
              ):
                  continue

              tag_name = full_ref[
                  len(prefix):
              ]

              print(
                  f"Tag: {tag_name}"
              )

              # ------------------------------------------------------
              # LIGHTWEIGHT TAG
              # ------------------------------------------------------

              if object_type != "tag":

                  target_sha = object_sha

                  if target_sha in commit_map:

                      target_sha = commit_map[
                          target_sha
                      ]

                  github_api(
                      "POST",
                      f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/refs",
                      {
                          "ref": f"refs/tags/{tag_name}",
                          "sha": target_sha
                      }
                  )

                  continue

              # ------------------------------------------------------
              # ANNOTATED TAG
              # ------------------------------------------------------

              raw_tag = git_command(
                  "cat-file",
                  "tag",
                  object_sha,
                  raw=True
              ).decode(
                  "utf-8",
                  errors="replace"
              )

              if "\n\n" in raw_tag:

                  tag_header, tag_message = (
                      raw_tag.split(
                          "\n\n",
                          1
                      )
                  )

              else:

                  tag_header = raw_tag
                  tag_message = ""

              target_sha = None

              tagger_name = None
              tagger_email = None
              tagger_timestamp = None
              tagger_timezone = None

              for header_line in (
                  tag_header.splitlines()
              ):

                  if header_line.startswith(
                      "object "
                  ):

                      target_sha = (
                          header_line[
                              len("object "):
                          ].strip()
                      )

                  elif header_line.startswith(
                      "tagger "
                  ):

                      value = (
                          header_line[
                              len("tagger "):
                          ]
                      )

                      identity, timestamp, timezone_value = (
                          value.rsplit(
                              " ",
                              2
                          )
                      )

                      name, email = identity.rsplit(
                          " <",
                          1
                      )

                      tagger_name = name

                      tagger_email = (
                          email.rstrip(">")
                      )

                      tagger_timestamp = (
                          timestamp
                      )

                      tagger_timezone = (
                          timezone_value
                      )

              # ------------------------------------------------------
              # SIGNED ANNOTATED TAG
              # ------------------------------------------------------

              if (
                  "-----BEGIN PGP SIGNATURE-----"
                  in tag_message
              ):

                  raise RuntimeError(
                      "\n"
                      "========================================\n"
                      "SIGNED ANNOTATED TAG DETECTED\n"
                      "========================================\n"
                      f"Tag: {tag_name}\n"
                      f"Object: {object_sha}\n"
                      "\n"
                      "GitHub's Create Tag Object API does not "
                      "provide a signature field for signed "
                      "annotated tags.\n"
                      "\n"
                      "The workflow stopped instead of silently "
                      "changing the signed tag.\n"
                      "========================================"
                  )

              if target_sha is None:

                  raise RuntimeError(
                      f"Annotated tag {tag_name} "
                      "has no target object."
                  )

              if target_sha in commit_map:

                  target_sha = commit_map[
                      target_sha
                  ]

              if (
                  tagger_name is None
                  or tagger_email is None
                  or tagger_timestamp is None
                  or tagger_timezone is None
              ):

                  raise RuntimeError(
                      f"Could not parse tagger "
                      f"information for {tag_name}"
                  )

              tagger_date = git_date_to_iso(
                  tagger_timestamp,
                  tagger_timezone
              )

              response = github_api(
                  "POST",
                  f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/tags",
                  {
                      "tag": tag_name,
                      "message": tag_message,
                      "object": target_sha,
                      "type": "commit",
                      "tagger": {
                          "name": tagger_name,
                          "email": tagger_email,
                          "date": tagger_date
                      }
                  }
              )

              tag_object_sha = response.get(
                  "sha"
              )

              if not tag_object_sha:

                  raise RuntimeError(
                      f"GitHub did not return "
                      f"a tag object SHA for "
                      f"{tag_name}"
                  )

              github_api(
                  "POST",
                  f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/refs",
                  {
                      "ref": f"refs/tags/{tag_name}",
                      "sha": tag_object_sha
                  }
              )


          # ==========================================================
          # VERIFY MAIN
          # ==========================================================

          print()
          print("========================================")
          print("VERIFYING BACKUP")
          print("========================================")

          source_main = git_command(
              "rev-parse",
              "refs/remotes/origin/main"
          ).strip()

          remote_main_response = github_api(
              "GET",
              f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}/git/ref/heads/main",
              write=False
          )

          remote_main = (
              remote_main_response[
                  "object"
              ][
                  "sha"
              ]
          )

          print(
              f"Source main : {source_main}"
          )

          print(
              f"Backup main : {remote_main}"
          )

          if remote_main != source_main:

              raise RuntimeError(
                  "\nMAIN BRANCH SHA VERIFICATION FAILED\n"
                  f"Source: {source_main}\n"
                  f"Backup: {remote_main}"
              )


          # ==========================================================
          # VERIFY BRANCHES
          # ==========================================================

          remote_branches = []

          page = 1

          while True:

              response = github_api(
                  "GET",
                  f"/repos/{BACKUP_OWNER}/{BACKUP_REPO}"
                  f"/branches?per_page=100&page={page}",
                  write=False
              )

              if not response:
                  break

              for item in response:

                  remote_branches.append(
                      item["name"]
                  )

              if len(response) < 100:
                  break

              page += 1

          source_branch_set = set(
              branches
          )

          backup_branch_set = set(
              remote_branches
          )

          if (
              source_branch_set
              != backup_branch_set
          ):

              missing = sorted(
                  source_branch_set
                  - backup_branch_set
              )

              extra = sorted(
                  backup_branch_set
                  - source_branch_set
              )

              raise RuntimeError(
                  "\nBRANCH VERIFICATION FAILED\n"
                  f"Missing: {missing}\n"
                  f"Extra: {extra}"
              )


          # ==========================================================
          # SUCCESS
          # ==========================================================

          print()
          print("========================================")
          print("BACKUP COMPLETED SUCCESSFULLY")
          print("========================================")

          print(
              f"Source repository : "
              f"{SOURCE_OWNER}/{SOURCE_REPO}"
          )

          print(
              f"Backup repository : "
              f"{BACKUP_OWNER}/{BACKUP_REPO}"
          )

          print(
              f"Commits backed up : "
              f"{len(commit_map)}"
          )

          print(
              f"Trees backed up   : "
              f"{len(tree_map)}"
          )

          print(
              f"Blobs backed up   : "
              f"{len(blobs)}"
          )

          print(
              f"Branches restored : "
              f"{len(branches)}"
          )

          print()
          print(
              f"https://github.com/"
              f"{BACKUP_OWNER}/"
              f"{BACKUP_REPO}"
          )

          print(
              "========================================"
          )

          PYTHON

      # ============================================================
      # FINAL SUMMARY
      # ============================================================

      - name: Backup summary
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "PRIVATE BACKUP SUCCESSFUL"
          echo "========================================"
          echo "Source : HARSHITC0DER/java"
          echo "Backup : ARJUNC0DER/${BACKUP_REPO}"
          echo "URL    : https://github.com/ARJUNC0DER/${BACKUP_REPO}"
          echo "========================================"
