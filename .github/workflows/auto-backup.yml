name: Full Private Git History Backup

"on":
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  backup:
    # IMPORTANT:
    # Only the original repository creates backups.
    # Backup repositories will never create another backup.
    if: github.repository == 'HARSHITC0DER/java'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ARJUNC0DER

      - name: Create private full-history backup
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e

          OWNER="ARJUNC0DER"
          REPO="${SOURCE_REPO#*/}"

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BACKUP_REPO="${REPO}-backup-${TIMESTAMP}"

          echo "========================================"
          echo "FULL PRIVATE GIT BACKUP"
          echo "========================================"
          echo "Source repository : $SOURCE_REPO"
          echo "Backup owner      : $OWNER"
          echo "Backup repository : $BACKUP_REPO"
          echo "Commit            : $COMMIT_SHA"
          echo "========================================"

          # Verify App identity
          LOGIN=$(gh api user --jq '.login' 2>/dev/null || true)
          echo "Authenticated identity: $LOGIN"

          # Create a NEW PRIVATE repository
          gh repo create "$OWNER/$BACKUP_REPO" \
            --private \
            --description "Complete Git history backup of $REPO at commit $COMMIT_SHA"

          echo "Private backup repository created."

          # Verify repository exists and is private
          gh api "repos/${OWNER}/${BACKUP_REPO}" \
            --jq '"Repository confirmed: " + .full_name + " | Private: " + (.private | tostring)'

          # Configure Git to authenticate using the GitHub App token
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

          # Remove original remote
          git remote remove origin || true

          # Add backup repository
          git remote add backup \
            "https://github.com/${OWNER}/${BACKUP_REPO}.git"

          echo "========================================"
          echo "Pushing ALL branches..."
          echo "========================================"

          git push backup --all

          echo "========================================"
          echo "Pushing ALL tags..."
          echo "========================================"

          git push backup --tags

          echo "========================================"
          echo "BACKUP SUCCESSFUL"
          echo "========================================"
          echo "Git history : COMPLETE"
          echo "Branches    : ALL"
          echo "Tags        : ALL"
          echo "Visibility  : PRIVATE"
          echo "========================================"

          echo "Backup repository:"
          echo "https://github.com/${OWNER}/${BACKUP_REPO}"
