        if: success()
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "PRIVATE GIT BACKUP SUCCESSFUL"
          echo "========================================"
          echo "Source:"
          echo "  https://github.com/HARSHITC0DER/java"
          echo
          echo "Backup:"
          echo "  https://github.com/ARJUNC0DER/${BACKUP_REPO}"
          echo "========================================"
