name: Test Create And Push

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create test repository and push
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -e

          OWNER="ARJUNC0DER"
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          TEST_REPO="git-push-test-${TIMESTAMP}"

          echo "Creating: ${OWNER}/${TEST_REPO}"

          gh repo create "${OWNER}/${TEST_REPO}" \
            --private \
            --description "Temporary Git push authentication test"

          echo "Repository created."

          echo "Testing Git push..."

          git remote add backup \
            "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${TEST_REPO}.git"

          git push backup --mirror

          echo "SUCCESS: Repository creation and Git push both work."

          echo "Test repository:"
          echo "https://github.com/${OWNER}/${TEST_REPO}"
