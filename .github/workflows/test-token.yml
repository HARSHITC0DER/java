name: Test Backup Token

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test PAT
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -e

          echo "Testing GitHub authentication..."

          gh api user \
            --jq '"Authenticated account: " + .login'

          echo "Checking ARJUNC0DER repositories..."

          gh api "user/repos?per_page=5" \
            --jq '.[] | .full_name + " | Private: " + (.private | tostring)'

          echo "Checking source repository..."

          gh api repos/HARSHITC0DER/java \
            --jq '"Source repository: " + .full_name'

          echo "PAT test completed successfully."
