name: Test API Write

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test API write
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -e

          OWNER="ARJUNC0DER"
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          REPO="api-write-test-${TIMESTAMP}"

          echo "Creating repository..."

          gh repo create "$OWNER/$REPO" \
            --private

          echo "Repository created."

          echo "Testing Contents API..."

          echo "hello from API test" > test.txt

          CONTENT=$(base64 -w 0 test.txt)

          gh api \
            --method PUT \
            "repos/${OWNER}/${REPO}/contents/test.txt" \
            -f message="Test API write" \
            -f content="$CONTENT"

          echo "SUCCESS: API can write to the repository."

          echo "Repository:"
          echo "https://github.com/${OWNER}/${REPO}"
