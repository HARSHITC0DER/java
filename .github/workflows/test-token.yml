name: Test Git Push Access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Git HTTPS authentication
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -e

          echo "Testing Git access..."

          git ls-remote \
            "https://x-access-token:${GH_TOKEN}@github.com/ARJUNC0DER/java-backup-20260826-101339.git"

          echo "Git HTTPS authentication works."
