name: Test Git Push

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Test push
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -e

          git config user.name "ARJUNC0DER"
          git config user.email "ARJUNC0DER@users.noreply.github.com"

          git remote add backup \
            "https://x-access-token:${GH_TOKEN}@github.com/ARJUNC0DER/java-backup-20260826-101339.git"

          echo "Testing mirror push..."

          git push backup --mirror

          echo "SUCCESS: Git mirror push completed."
